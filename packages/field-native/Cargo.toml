[package]
name = "field-native"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
hex = "0.4.3"
hmac = "0.13.0"
rand = "0.10.2"
regress = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
