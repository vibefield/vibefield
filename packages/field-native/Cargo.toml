[package]
name = "field-native"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
# TP-S3a — the cell-side T1 door layer (terminal-pipeline-v3 §8, TP-D26): two
# loopback WebSocket doors per cell over tokio-tungstenite. Every crate below is
# ALREADY in the lockfile at this version (truffle-core / ghosttea pull them), so
# this is no EL8 event and the lock does not move.
bytes = "1.12.1"
data-encoding = "2.11.0"
futures-util = "0.3.33"
http = "1.4.2"
ghosttea.workspace = true
hex = "0.4.3"
hmac = "0.13.0"
rand = "0.10.2"
regress = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.47", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
truffle-core.workspace = true
tracing-subscriber = "0.3.23"

[target.'cfg(unix)'.dependencies]
# fd/signal plumbing (logging stderr capture, pid liveness) — unix-only by
# nature; the windows arms use std + the tokio named-pipe surface instead.
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
# The unix table's twin: handle plumbing for the logging floor (stderr capture
# via CreatePipe/SetStdHandle, pid liveness via OpenProcess). Already in the
# lockfile at this version through tokio/mio, so the pin follows the lock rather
# than moving it — not an EL8 upgrade event. Win32_Security buys no API of ours;
# windows-sys gates the `CreatePipe` declaration on it for SECURITY_ATTRIBUTES.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[features]
# DS-1 — the REAL egress arm (`services/mesh_egress.rs`, `TruffleEgress`),
# written against the RFC 026 API the wave plan names.
#
# ON BY DEFAULT since 2026-10-17 (DECISIONS, the TB-E row). James ruled the
# truffle bump B on 2026-10-15 20:52Z, and its field-native step is "make it
# production: the feature on by default, with UnsupportedEgress left only for a
# sidecar below 7" (draft/handover/2026-10-15-truffle-bump-plan.md §3). The pin
# under it is truffle-core =0.7.19 (the root Cargo.toml), which ships RFC 026, and
# the five npm sidecars at 0.7.19 speak protocol 8 (egress needs 7). A node whose
# sidecar predates 7 still answers `egress-unsupported`, per call, from the core.
# REVERT, without touching the pin: delete `"truffle-egress"` from `default`
# below. The build is then `UnsupportedEgress` again, and fieldd rides the OS
# network.
default = ["truffle-egress"]
truffle-egress = []

[dev-dependencies]
tempfile = "3.27.0"
