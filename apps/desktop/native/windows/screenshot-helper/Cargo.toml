# SNAP-D7 — this crate is its own workspace root. The repo's root Cargo workspace
# is the MAC gate (`cargo test/clippy --workspace`) and cannot build Win32-only
# code, so the root manifest `exclude`s this path and the empty `[workspace]`
# table below stops cargo from walking up into it.
[workspace]

[package]
name = "field-screenshot-helper"
version = "0.1.0"
edition = "2021"
description = "VibeField native screenshot helper (Windows)"
publish = false

[[bin]]
name = "field-screenshot-helper"
path = "src/main.rs"

[dependencies]
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.2"

[dependencies.windows]
version = "0.61.1"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "System",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winres = "0.1"
