# electron-builder configuration (WP4; distribution spec §7.5 builder shape, §7.3/§7.4 for what
# may enter the package, §6.2 for this directory's layout; ASAR policy and the internal layout are
# electron-security-packaging.md §10's — this file expresses them, it does not redefine them).
#
# THIS CONFIG PACKAGES A STAGE, NOT THE WORKSPACE. `node scripts/stage-package.mjs` builds
# apps/desktop/build/stage/ from an exact allowlist; every path below points into that stage.
# Nothing here globs the repo, so the §7.3 must-never-ship list is enforced in one place (the
# stager) instead of being re-litigated in builder globs. Run the stager first — a build against
# a stale or absent stage is exactly what §7.2 forbids.
#
# All relative paths resolve against apps/desktop (the project directory holding this config's
# package.json), EXCEPT `files`, which resolves against `directories.app`.

# ─────────────────────────────────────────────────────────────────────────────
# IDENTITY — B-1 RESOLVED 2026-07-25
# ─────────────────────────────────────────────────────────────────────────────
# Frozen in packaging/release-identity.json at identityRevision 2. Changing it after a public
# release is a migration, not an edit: signatures, the update feed, taskbar pinning and
# notification routing all key off it. The ledger's freeze rule refuses a silent change —
# check-release-identity.mjs compares frozen values against HEAD and demands an identityRevision
# bump in the same commit.
appId: com.jamesyong.vibefield
executableName: VibeField

# ─────────────────────────────────────────────────────────────────────────────
# HISTORICAL NOTE — what this block looked like while B-1 was open
# ─────────────────────────────────────────────────────────────────────────────
# The real value is owner input tracked in packaging/release-identity.json, where appId and
# windowsAppUserModelId both sit at status "blocker" / value null under B-1. §7.6 is why it cannot
# be guessed here: appId is a value an installed VibeField is KNOWN BY, and changing it after a
# public release is a migration — signatures, update feeds, taskbar pinning and notification
# routing all key off it.
#
# So this placeholder is deliberately NOT a plausible reverse-DNS id. It is prefixed INVALID so it
# is unmistakable in Info.plist/Finder, and it ends in `.invalid` — the RFC 2606 reserved TLD,
# which can never be a real domain — so that even read backwards it cannot collide with anyone's
# identifier. A local `--dir` build accepts it; nothing else should.
#
# RELEASE GATE: a signed build MUST fail while this value is here. The mechanism is
# `node scripts/check-release-identity.mjs --require-frozen` (report-only today; §16.1's
# first-signed-beta gate turns it on), which exits non-zero for every unfrozen field. The release
# workflow runs it BEFORE electron-builder. Freezing B-1 means editing release-identity.json with
# an identityRevision bump, then replacing the line below — in the same commit.
# (The placeholder was `INVALID.unresolved-blocker-B-1.vibefield.invalid` — deliberately not a
# plausible reverse-DNS id, ending in RFC 2606's reserved `.invalid` TLD so it could never
# collide with a real identifier even read backwards. Kept recorded because the pattern is worth
# reusing for the blockers still open below.)

# Frozen in release-identity.json, and already load-bearing at runtime via app.setName().
productName: VibeField

directories:
  # The staged ASAR root. Pointing `app` at it makes the stager's generated package.json — name,
  # version, main: shell/main/index.cjs, and nothing else (§7.3) — the manifest electron-builder
  # reads, while devDependencies (electron itself) still come from apps/desktop/package.json.
  # That is electron-builder's two-package layout, used here so the packaged manifest carries no
  # scripts and no dev wiring.
  app: build/stage/app
  output: release
  buildResources: packaging

# ASAR is mandatory (ESP §10.2), and there is deliberately NO asarUnpack: §10.2 requires it to be
# minimal and evidence-driven rather than a convenience escape. Everything needing a real
# filesystem path — the wasm loro reads via __dirname, the worker entry `new Worker` opens, the
# native sidecar — is an extraResource below instead.
asar: true

# *(Corrected 2026-10-15, WP12 L3a: "cannot widen the archive" was false — the dependency collector widened it with
# three `node_modules/@vibecook/truffle-sidecar-darwin-arm64` paths, in the build of 2026-08-16 and in WP8's of
# 2026-10-14 alike; the `node_modules` negation below closes that door and `audit-asar.mjs` gates it.)*
# The stage is already the allowlist; this is the second lock, so a polluted stage still cannot
# widen the archive. The negations are not redundant: `assets/**/*` is the one glob here, and it
# is exactly where a future Vite config change could start emitting source maps (§7.3 forbids them
# absent a security review). The stager fails on the same material — two independent refusals.
files:
  - package.json
  - shell/main/index.cjs
  # SD-2: the sound renders' thread, which main starts from beside its own bundle
  - shell/main/sound-worker.cjs
  - shell/preload/index.cjs
  - shell/renderer/index.html
  - shell/renderer/assets/**/*
  - "!**/*.map"
  - "!**/*.{ts,tsx,cts,mts}"
  - "!**/testing/**"
  # WP12-D12 (L3a): no dependency enters the archive. The positive entries above do not bound what electron-builder's
  # dependency collector adds: it reads apps/desktop's package.json too (app-builder-lib 26.15.7
  # `util/appFileCopier.js:236`) and counts `optionalDependencies` as production (`nodeModulesCollector.js:169`), so the
  # `@vibecook/truffle-sidecar-*` rows put a SECOND signed `sidecar-slim` in the asar — Squirrel.Mac's strict nested
  # validation's silent failure (EDP §16.1). The stage resolves the sidecar into `bin/` itself; the asar needs none.
  # `scripts/audit-asar.mjs` is the gate (the release workflow's build job).
  - "!**/node_modules/**"

# §7.4 external resources, landing under Resources/. Flat `bin/` holds because packages are
# architecture-specific (EDP-22/23); per-arch subdirectories arrive with the universal-build
# amendment, not before. The stager always creates all three directories even when empty, so this
# config does not break a build while bundled plugins (WP8) do not exist yet — a missing
# extraResources source is a hard electron-builder error. Tray assets are generated and checked
# before staging; an empty tray directory is now a package failure.
# Executable bits: the stager sets the floor's THREE binaries — field-native, its TC-S2 terminal
# cell field-terminal-host and its F1 freeway host field-freeway-host — to 0755 and asserts it
# (§7.4); confirm they survived the copy in the packaged-artifact check, since that assertion is
# about the stage, not the .app. The three ride in the same flat `bin/` because the floor resolves
# the other two as SIBLINGS of its own executable; splitting them across directories would break
# the resolution, not just the layout.
extraResources:
  - from: build/stage/bin
    to: bin
  - from: build/stage/tray
    to: tray
  - from: build/stage/icons
    to: icons
  - from: build/stage/plugins
    to: plugins
  # WP8b: the stage's public identity — the trust-root document, its signatures and release-identity.json
  # (key class + root keys). The shell reads it in the packaged layout and hands fieldd the document's path
  # and root keys (FIELDD_TRUST_ROOT, FIELDD_TRUST_ROOT_KEYS); outside app.asar so fieldd reads it as a file.
  - from: build/stage/identity
    to: identity
  # LP-5: the third-party notices the stager generates (THIRD_PARTY_NOTICES.txt) and the licence files beside them —
  # Electron's LICENSE and LICENSES.chromium.html, which this builder deletes from a macOS app's root, and Node's for
  # fieldd's runtime. Outside app.asar so a person (and Finder) can read them as files.
  - from: build/stage/legal
    to: legal

# NO `electronFuses:` BLOCK HERE — deliberately, not by omission. EDP-31 split the packaging
# surface: electron-security-packaging.md §9.1 owns the single fuse matrix (including the
# transitional states where RunAsNode and GrantFileProtocolExtraPrivileges stay enabled), and
# §9.2's @electron/fuses package hook owns the mechanism that flips them in the correct order
# relative to signing. Distribution spec §7.5 deleted its own fuse block for the same reason.
# A fuse configured here would be a second, competing source of truth — the exact drift EDP-31
# exists to prevent.
#
# The hook below is that mechanism. electron-builder's own `electronFuses:` option would flip
# fuses too, but it does not READ THEM BACK, and §9.2 requires proving what the artifact carries
# rather than what we asked for. afterPack runs after packaging and before signing — the only
# window where flipping is legal, since nothing may mutate a signed executable.
afterPack: packaging/after-pack.mjs

# Apple platforms use the layered Icon Composer source; electron-builder 26 compiles it with
# Xcode 26 actool into Assets.car (light, dark and tinted appearances) plus an ICNS fallback. The
# other platform icons are copied from the reviewed studio collection with its optical tuning
# preserved (icons/README.md). Paths are explicit so builder defaults cannot silently select a stale
# conventional filename.

# The staged app declares no dependencies and ships no node_modules, so there is nothing to
# rebuild. Off explicitly: a rebuild step that silently does nothing is still a step that can
# start doing something.
npmRebuild: false

# WP12 (build-wp12-updater.md D13): REQUIRED — electron-updater reads `Resources/app-update.yml` for its cache dir
# name (`AppUpdater.js:545`, even with VibeField's custom provider), and electron-builder writes that file only with a
# publish provider configured; it also writes `latest*.yml` beside the artifacts only then. This block only
# NAMES the origin — it never publishes: no command in this repository passes `--publish`, and the release workflow
# (WP12e) uploads the signed feed itself after the TD-3 `sign` step. The origin is the frozen identity constant
# `updateOrigin` (release-identity.json, EDP-30); the client reads the feed through VibeField's UpdateProvider (TD-3),
# never through this provider's own resolution.
# *(Corrected 2026-10-15, WP12 L3a: "no command in this repository passes `--publish`" was not enough — given none,
# electron-builder publishes IMPLICITLY under a git tag or CI (app-builder-lib 26.15.7 `PublishManager.js:46-60`), which
# the release workflow is. `run-electron-builder.mjs` now passes `--publish never` on every build and refuses any other.)*
publish:
  provider: github
  owner: vibefield
  repo: vibefield
  releaseType: draft

mac:
  target: [dmg, zip]
  minimumSystemVersion: "14.0" # LP-1: the real floor (the screenshot helper targets macos14.0); = policy/*.json floors.os
  icon: packaging/icons/app.icon
  # Item 181 (2026-11-05): the usage strings macOS shows when something asks for a protected resource. Electron's own
  # Info.plist carries five generic ones ("This app needs access to the camera"), and this block replaces them: the
  # builder deep-assigns extendInfo over Electron's plist and deletes a key set to null (app-builder-lib macPackager.js
  # :404-411), BEFORE signing, so the signature covers them. The release overlay extends this file, so every package
  # carries the same words.
  # WHO ASKS. Electron main spawns fieldd and the native plane spawns every terminal, and nothing disclaims
  # responsibility, so a program running in a VibeField terminal, an agent included, asks AS VibeField (Apple TN3179):
  # macOS shows these words and records the choice for the whole app.
  # THE WALL. The hardened runtime gates seven classes behind entitlements this app does not hold
  # (entitlements.mac.plist: allow-jit alone): the camera, the microphone, Apple Events, Contacts, Calendars (Reminders
  # ride it), Photos and location; speech recognition records through the microphone. On a SIGNED package they are
  # refused with no prompt (EL7: one Allow would open a class to every agent). Their strings stay declared: on an
  # unsigned package of ours opened by LaunchServices nothing hardens the app, and a missing string is TCC's kill of
  # the asking program where a present one prompts. Opening a class is James's call, per class: its entitlement lands
  # with its string. The audit, and the three states its test holds: tooling/dev-runner/test/usage-strings.test.mjs.
  # No key exists for screen recording (the system's own prompt). NSBonjourServices is omitted: nothing we ship
  # browses a service type.
  extendInfo:
    # walled on a signed package (no entitlement)
    NSCameraUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to use the camera. VibeField itself doesn't."
    NSMicrophoneUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to use the microphone. VibeField itself doesn't."
    NSAppleEventsUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to control another app."
    NSContactsUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to read your contacts."
    NSCalendarsFullAccessUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to read and change your calendars."
    NSRemindersFullAccessUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to read and change your reminders."
    # the same two under their pre-macOS 14 names: a program built on an older SDK may ask by them
    NSCalendarsUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to read and change your calendars."
    NSRemindersUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to read and change your reminders."
    NSPhotoLibraryUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to use your photo library."
    NSLocationUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to know your location."
    NSLocationWhenInUseUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to know your location."
    NSSpeechRecognitionUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to turn speech into text."
    # entitlement-free: these prompt as VibeField today
    NSBluetoothAlwaysUsageDescription: "A program running in a VibeField terminal, or a website open in its browser, wants to use Bluetooth. VibeField itself doesn't."
    NSAudioCaptureUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to record the sound your Mac is playing."
    NSDesktopFolderUsageDescription: "VibeField and the programs in its terminals need this to work with projects kept on your Desktop."
    NSDocumentsFolderUsageDescription: "VibeField and the programs in its terminals need this to work with projects kept in your Documents folder."
    NSDownloadsFolderUsageDescription: "VibeField and the programs in its terminals need this to work with files in your Downloads folder."
    NSRemovableVolumesUsageDescription: "VibeField and the programs in its terminals need this to work with projects kept on an external drive."
    NSNetworkVolumesUsageDescription: "VibeField and the programs in its terminals need this to work with projects kept on a network drive."
    NSFileProviderDomainUsageDescription: "VibeField and the programs in its terminals need this to work with projects kept in iCloud Drive or another synced folder."
    NSLocalNetworkUsageDescription: "VibeField connects your devices directly over your local network, and the programs in its terminals may reach devices on it."
    NSAppDataUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to read another app's data."
    NSAppBundlesUsageDescription: "A program running in a VibeField terminal, such as an agent you started, wants to update or remove another app."
    NSSystemAdministrationUsageDescription: "A program running in a VibeField terminal wants to change a system setting, which needs an administrator."
    # deprecated (Apple); macOS 14, the floor, reads NSBluetoothAlwaysUsageDescription
    NSBluetoothPeripheralUsageDescription: null
  # Explicit nested-code inventory. It is inert while identity remains null,
  # but becomes the inside-out signing list when WP10 enables signing; the SCK
  # helper and its Node-API adapter must never be left as unsigned loose code.
  # field-terminal-host and field-freeway-host are listed for the same reason they
  # are staged (TC-S2, F1): the floor spawns each as a child executable, so an
  # unsigned or unnotarized one is killed by Gatekeeper at spawn — the terminal or
  # the freeway would fail in the signed build and only in the signed build.
  binaries:
    - Contents/Resources/bin/fieldd
    - Contents/Resources/bin/field-native
    - Contents/Resources/bin/field-terminal-host
    - Contents/Resources/bin/field-freeway-host
    - Contents/Resources/bin/sidecar-slim
    - Contents/Resources/bin/live-surface-capture-helper
    - Contents/Resources/bin/live-surface-adapter.node
    - Contents/Resources/bin/desktop-haptics.node
    # SD-2: the system-sound player, a Node-API bundle like the haptic adapter (its identity is embedded)
    - Contents/Resources/bin/desktop-sound-player.node
    # FS: @electron/osx-sign discovers mille.darwin-<arch>.node as binary code.
    # verify-files-package.mjs --require-signed checks its actual nested signature.
    # Do not use ${arch} here: builder removes it on single-architecture builds.
    # SNAP-D5/D9: the screenshot helper is a nested BUNDLE (TCC keys consent on it), staged
    # whole under bin/; the signer seals its executable inside-out with the app. Optional in
    # the stage — a package without it boots and answers `helper-missing` — so WP10's signer
    # must tolerate its absence in a preview and require it under --require-complete.
    - Contents/Resources/bin/field-screenshot-helper.app/Contents/MacOS/field-screenshot-helper
    # AR-8 (L3): History's index daemon — a child fieldd spawns, sealed inside-out like
    # field-native. Optional in the stage as the screenshot helper is, with the same
    # consequence for a SIGNED build: the signer codesigns every listed path, so it signs
    # only a stage that has it (release packaging stages with --require-complete first).
    # It inherits entitlements.mac.inherit.plist like every nested binary here; it needs
    # none of it (no JIT), and this builder has no per-file entitlements to say so.
    # *(Corrected 2026-11-05, LP-6: it no longer inherits it. The release overlay's sign hook,
    # packaging/sign-mac.mjs, signs every entry below but fieldd with entitlements.mac.native.plist
    # (no key) by codesign-entitlements.mjs's BIN_PROFILES; fieldd, the Node SEA, keeps allow-jit.)*
    # verify-history-package.mjs --require-signed checks its actual nested signature.
    - Contents/Resources/bin/rosettad
  # Hardened runtime is on from the first package even though nothing is signed yet, so the
  # entitlement set is exercised from the start rather than discovered at notarization time.
  hardenedRuntime: true
  # UNSIGNED, EXPLICITLY. A WP4 build is `electron-builder --dir` and unsigned; `identity: null`
  # states that rather than leaving it to whether the builder happens to have a certificate in
  # their keychain — otherwise two developers get materially different artifacts from the same
  # commit. WP10 owns signing and notarization and must replace this whole block with §7.5's
  # shape: forceCodeSigning: true, notarize: true, entitlements/entitlementsInherit pointing at
  # packaging/entitlements.mac.plist (§9.3), using the `binaries:` inventory above for inside-out
  # signing (ESP §10.5). Leaving `identity: null` in place
  # then is caught rather than silent: it contradicts forceCodeSigning and electron-builder fails.
  identity: null

# Windows and Linux are not GA targets (EDP-22/23); these blocks record §7.5's shape so the first
# build on either platform starts from the spec rather than from improvisation. forceCodeSigning
# is absent for the same reason it is on macOS — WP10 owns it.
win:
  target: [nsis]
  icon: packaging/icons/app.ico
  # The runtime AUMID and builder appId are both the frozen `com.jamesyong.vibefield`.
  # A future NSIS customization must preserve that identity (§5.6).

linux:
  target: [AppImage, deb]
  icon: packaging/icons/linux
  category: Utility
  # No `desktopName:` — electron-builder 26 removed it (the schema rejects the whole linux block
  # if present) in favour of a `desktop:` entry object. The .desktop filename, its
  # StartupWMClass and the `x-scheme-handler/vibefield` MimeType all have to agree with
  # executableName (§6.3, §10.3), which is blocker B-2 — so the Linux slice writes this block
  # once, from the current schema, rather than carrying a guess that validates but misnames.
