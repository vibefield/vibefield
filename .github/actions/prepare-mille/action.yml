name: Prepare the pinned mille sibling
description: Build the files service engine and renderer at the locked revision, with the host's React peers.
runs:
  using: composite
  steps:
    - name: Fetch mille at its locked revision
      shell: bash
      run: node scripts/siblings.mjs fetch mille
    # EL8: mille's native build runs in its own checkout, so the compiler is ITS rust-toolchain.toml's (VibeField's
    # own is installed by the workflow's toolchain step). A bare `rustup toolchain install` there installs exactly that.
    # NOT the root's file, on purpose: a sibling's toolchain is the sibling's (scripts/siblings.mjs builds by the same rule).
    - name: Rust toolchain (mille's rust-toolchain.toml)
      shell: bash
      working-directory: ../mille-pin
      run: |
        rustup toolchain install --no-self-update
        [ -n "${CARGO_INCREMENTAL+set}" ] || echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        [ -n "${CARGO_TERM_COLOR+set}" ] || echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        rustc --version --verbose
    - name: Install mille and bind the host peers
      shell: bash
      run: node scripts/siblings.mjs install-js mille
    - name: Build mille and its renderer
      shell: bash
      run: node scripts/siblings.mjs build-js mille
