name: Prepare the pinned Ghosttea sibling
description: Fetch the Cargo patch source and install/build the source-linked React renderer.
inputs:
  build:
    description: Build JavaScript now (verify builds it through siblings:build).
    default: "true"
runs:
  using: composite
  steps:
    - name: Fetch Ghosttea at its locked revision
      shell: bash
      run: node scripts/siblings.mjs fetch ghosttea
    - name: Install Ghosttea's renderer workspaces from its npm lockfile
      shell: bash
      run: node scripts/siblings.mjs install-js ghosttea
    - name: Build Ghosttea's renderer and its dependencies
      if: inputs.build == 'true'
      shell: bash
      run: node scripts/siblings.mjs build-js ghosttea
