# Supply-chain audit — REPORT-FIRST. Both jobs are continue-on-error, so a freshly
# disclosed advisory never blocks a solo dev's merge; HARDENING IS A ONE-LINE FLIP —
# drop `continue-on-error: true` (or set it false) on the audit step. Runs on Linux:
# audits read committed lockfiles (pnpm-lock.yaml, Cargo.lock) against advisory DBs —
# no native build, no siblings — so the macOS 10x minutes of verify.yml aren't spent here.
name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 15 * * 1" # Mondays — advisories land on the calendar, not on commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.3.0 — pnpm from the packageManager field
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # --prod: runtime deps only — a dev-only advisory doesn't ship. Reads pnpm-lock.yaml
      # against the npm advisory DB; deliberately NO `pnpm install` (that needs the ice
      # sibling for the file: dep). Hardening: drop continue-on-error.
      - run: pnpm audit --prod
        continue-on-error: true

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # EL8: the compiler is rust-toolchain.toml's. A bare `rustup toolchain install` installs the active toolchain — the
      # file's channel, components and profile — so CI and the Mac read ONE declaration (2026-10-21: a `stable`-branch
      # action installed the day's stable, and rustc 1.99.1's clippy reddened main while the Mac held 1.97.1).
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          [ -n "${CARGO_INCREMENTAL+set}" ] || echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          [ -n "${CARGO_TERM_COLOR+set}" ] || echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
          rustc --version --verbose
      - name: Cache cargo-audit
        id: cargo-audit-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - if: steps.cargo-audit-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      # Reads Cargo.lock against the RustSec DB; no build, so the truffle [patch] path
      # need not be present. Hardening: drop continue-on-error.
      - run: cargo audit --file Cargo.lock
        continue-on-error: true
