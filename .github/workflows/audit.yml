# Supply-chain audit — REPORT-FIRST. Both jobs are continue-on-error, so a freshly
# disclosed advisory never blocks a solo dev's merge; HARDENING IS A ONE-LINE FLIP —
# drop `continue-on-error: true` (or set it false) on the audit step. Runs on Linux:
# audits read committed lockfiles (pnpm-lock.yaml, Cargo.lock) against advisory DBs —
# no native build, no siblings — so the macOS 10x minutes of verify.yml aren't spent here.
name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 15 * * 1" # Mondays — advisories land on the calendar, not on commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 — pnpm from the packageManager field
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # --prod: runtime deps only — a dev-only advisory doesn't ship. Reads pnpm-lock.yaml
      # against the npm advisory DB; deliberately NO `pnpm install` (that needs the ice
      # sibling for the file: dep). Hardening: drop continue-on-error.
      - run: pnpm audit --prod
        continue-on-error: true

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-15
      - name: Cache cargo-audit
        id: cargo-audit-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - if: steps.cargo-audit-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      # Reads Cargo.lock against the RustSec DB; no build, so the truffle [patch] path
      # need not be present. Hardening: drop continue-on-error.
      - run: cargo audit --file Cargo.lock
        continue-on-error: true
