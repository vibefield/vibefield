# THE gate (CLAUDE.md "Commands"): `pnpm verify`, run VERBATIM. macOS runner so CI
# mirrors the dev machine (darwin) exactly — the desktop/Electron tests and the
# @vibecook/truffle-sidecar-darwin-* bits are native; green here must mean green there.
# AR-0 SIBLING MODE (2026-09-12): this repo consumes TWO sibling checkouts again —
# ../puppeteer (the agent runtime; its packages are `link:` rows) and ../rosetta-pin (agent
# history; `rosettad` is built from its source) — both pinned by revision in
# siblings.lock.json. EL8: the pins move only as deliberate upgrade events, and preflight
# hard-fails when a checkout does not match the lock. The clone step below is the
# truffle-era step (retired 7fcdfd2c) revived for the two repos.
# RD-5a (2026-10-14): rosetta's TypeScript packages are exact registry pins
# (`@vibefield/rosetta-*`), so its checkout serves rosettad's build alone (until RD-D7 ships
# it as a release asset); both repos are PUBLIC now, so the clone needs no token and
# SIBLINGS_TOKEN is retired.
# 2026-10-26 (RD-5's exit for puppeteer's npm plane): puppeteer's packages are exact registry
# pins too (`@vibefield/puppeteer-*` 0.2.3), so no job fetches ../puppeteer, and the
# prepare-puppeteer composite retired with its link: rows.
#
# RFC 025 WINDOW (2026-09-16) — READ THIS BEFORE TRUSTING A RED RUN. truffle 0.7.14 closed
# the cargo and npm halves the same day (UA-P-X): the [patch.crates-io] row is gone and the
# sidecars come from npm. The SWIFT half stayed open — ghosttea pins truffle exactly at
# 0.7.12 in every published tag, so the kit can move neither forward nor back (Cargo.toml's
# closure note has both errors) — so the lock STILL names ../truffle-rfc025. The cargo and npm
# planes are at 0.7.19, the lock pins that checkout at the PUBLISHED tag truffle-v0.7.19
# (1218b64) and records its public `repository`, so the fetch step below creates it at the
# tag; the release that frees the kit is a ghosttea Swift one at truffle 0.7.19. And truffle
# was not the only blocker:
# `pnpm siblings:pin` warns when a pinned revision is unpushed, and on 2026-09-16 it warned
# for ALL THREE siblings — puppeteer's and rosetta's pins are unpushed too, so this workflow
# could not be green with or without truffle. Stated rather than patched around: teaching the
# loop to skip a sibling would make CI verify a DIFFERENT TREE than the one the gate ran on,
# which is the whole thing this step exists to prevent.
# CLOSED 2026-10-23 (the EL8 to ghosttea 0.13.1, G28's exit): ghosttea v0.13.1 declares truffle
# exact 0.7.19, so the kit's truffle row is that exact version, and the lock records the release.
# No job fetches ../truffle-rfc025 any more: nothing builds from it, and preflight reads it only
# while `pnpm siblings use truffle` stands. The same lane released ghosttea on every plane, so
# ../ghosttea-0.11.2 is not fetched either.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # WP12e (L3a): release.yml's `verify` job runs THIS gate on the commit it releases (EDP §12.1 "verify, THE gate").
  workflow_call:

# One live run per ref; cancel superseded pushes. macOS minutes bill at 10x — never stack.
# The group is named by the RUNNING workflow (WP12e): standalone it is `verify-<ref>` as before; called from release.yml
# it is `release-<ref>`, so a push's verify on main never cancels the release's own gate on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The sibling checkouts, at the EXACT pinned SHAs, in the relative locations the
      # lock names (preflight resolves ../rosetta-pin from siblings.lock.json).
      # Both repos are PUBLIC (verified 2026-10-14), so `siblings.mjs fetch` clones each from
      # the lock's own `repository` with no token and checks out the pin detached; a pin that
      # is on no remote FAILS this step loudly — a verify that ran without the siblings would
      # be a verify of a different tree. Fresh detached checkouts are clean and at the pin, so
      # preflight's revision + dirty checks both pass. No shallow clone: a pin may sit behind
      # the branch tip. truffle was fetched too from the 0.7.19 bump (2026-10-17) until its Swift
      # plane closed (2026-10-23, the header's RFC 025 note): its checkout is no longer read.
      #
      # No puppeteer checkout since 2026-10-26: its npm plane is released (siblings.lock.json),
      # so its packages come from npm with this tree's install, and the prepare-puppeteer
      # composite that fetched it and ran its own install retired with the link: rows.
      - name: Fetch sibling checkouts at the pinned revisions (EL8, siblings.lock.json)
        run: |
          set -euo pipefail
          for name in rosetta; do
            node scripts/siblings.mjs fetch "$name"
          done

      # pnpm pinned from the packageManager field (pnpm@11.13.1); node from .nvmrc.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No ghosttea checkout since the EL8 to ghosttea 0.13.1 (2026-10-22/23): its npm and cargo
      # planes are released (siblings.lock.json), so the crates come from crates.io and the
      # React renderer from npm, and the prepare-ghosttea composite retired with the window.

      # EL8: the compiler is rust-toolchain.toml's. A bare `rustup toolchain install` installs the active toolchain — the
      # file's channel, components and profile — so CI and the Mac read ONE declaration (2026-10-21: a `stable`-branch
      # action installed the day's stable, and rustc 1.99.1's clippy reddened main while the Mac held 1.97.1).
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          [ -n "${CARGO_INCREMENTAL+set}" ] || echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          [ -n "${CARGO_TERM_COLOR+set}" ] || echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
          rustc --version --verbose

      # cargo-typify drives the contracts codegen; gen:check diffs are version-sensitive,
      # so the version is EXACT (0.7.0, per preflight). Cache the compiled binary — it's
      # a fixed input, not a per-commit one.
      - name: Cache cargo-typify 0.7.0
        id: typify
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-0.7.0-${{ runner.os }}
      - if: steps.typify.outputs.cache-hit != 'true'
        run: cargo install cargo-typify --version 0.7.0 --locked

      # Registry/git/target cache for the Rust builds: field-native (+ truffle-core source)
      # here, and the rosetta sibling's rosettad (its own workspace, its own target dir).
      # cache-bin off: the typify binary is owned by the dedicated cache step above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          workspaces: |
            . -> target
            ../rosetta-pin -> target

      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-mille

      # rosettad from the pinned sibling (rustup picks its rust-toolchain.toml). The fieldd
      # supervisor's kill matrix runs against a scripted daemon in every gate; the one row
      # against the REAL binary is opt-in through FIELDD_ROSETTAD_BIN, and CI opts in.
      - name: Build rosettad and the Ghosttea renderer from their pinned siblings
        run: pnpm siblings:build
      - name: Name the built rosettad for the live supervisor rows
        # `set -e` + a separate assignment: a `bin` that fails (not built) fails THIS step,
        # rather than exporting an empty value that would silently skip the live rows.
        run: |
          set -euo pipefail
          bin=$(node scripts/siblings.mjs bin)
          test -x "$bin"
          echo "FIELDD_ROSETTAD_BIN=$bin" >> "$GITHUB_ENV"

      # THE gate, verbatim: preflight -> typecheck -> biome -> rustfmt/clippy -> TS+Rust tests -> gen freshness.
      #
      # Its output goes to a FILE (tooling (4), 2026-10-26). Nx prints at most 64 KiB of a task's section when its
      # stdout is a PIPE, which a step's is: fieldd's vitest section stopped mid-line after about half of its files,
      # so a red row past the cut was never in the log. On 7011674dd (run 40042292811) and 88c325698 (run 40047228992)
      # workspace-places.test.ts, red where it was printed, had no line at all and was read as green (item 58). Given
      # a file, Nx writes each section whole. `tail -F` streams that file into this log as it grows, so the job still
      # reads live, and the file is uploaded whole below. A reader's rule all the same: a row absent from a log is
      # UNRECORDED, not green.
      - name: pnpm verify (whole output to verify.log, streamed here)
        run: |
          : > verify.log
          tail -n +1 -F verify.log &
          tailer=$!
          status=0
          pnpm verify > verify.log 2>&1 || status=$?
          sleep 2
          kill "$tailer" 2>/dev/null || true
          exit "$status"
      - name: Upload verify.log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-log
          path: verify.log
          if-no-files-found: warn
          retention-days: 14
