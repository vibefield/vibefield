# THE gate (CLAUDE.md "Commands"): `pnpm verify`, run VERBATIM. macOS runner so CI
# mirrors the dev machine (darwin) exactly — the desktop/Electron tests and the
# @vibecook/truffle-sidecar-darwin-* bits are native; green here must mean green there.
# This repo does NOT build standalone: it consumes ONE sibling checkout
# (../p008/truffle — cargo [patch]) pinned by siblings.lock.json. EL8: the sibling
# revision is a deliberate pin, never drift, and preflight hard-fails if the checkout
# doesn't match the lock. @vibecook/ice left this dance on 2026-07-25 — it is an exact
# registry pin now (0.2.0), so npm ships its dist and there is nothing to clone or build.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One live run per ref; cancel superseded pushes. macOS minutes bill at 10x — never stack.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # truffle is a separate PUBLIC repo on the same account — a plain HTTPS clone
      # needs no token. Check out the EXACT pinned SHA into the relative location
      # preflight resolves (../p008/truffle). A fresh detached checkout is clean and at
      # the pinned SHA, so preflight's revision + dirty checks both pass. No shallow
      # clone: the pin may sit behind the branch tip.
      - name: Fetch sibling checkout at pinned revision (EL8)
        run: |
          set -euo pipefail
          truffle_sha=$(jq -r '.siblings.truffle' siblings.lock.json)
          mkdir -p ../p008
          git clone --no-tags https://github.com/vibecook-dev/truffle.git ../p008/truffle
          git -C ../p008/truffle checkout --detach "$truffle_sha"

      # pnpm pinned from the packageManager field (pnpm@11.13.1); node from .nvmrc.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # cargo-typify drives the contracts codegen; gen:check diffs are version-sensitive,
      # so the version is EXACT (0.7.0, per preflight). Cache the compiled binary — it's
      # a fixed input, not a per-commit one.
      - name: Cache cargo-typify 0.7.0
        id: typify
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-0.7.0-${{ runner.os }}
      - if: steps.typify.outputs.cache-hit != 'true'
        run: cargo install cargo-typify --version 0.7.0 --locked

      # Registry/git/target cache for the Rust build (field-native + truffle-core source).
      # cache-bin off: the typify binary is owned by the dedicated cache step above.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - run: pnpm install --frozen-lockfile

      # THE gate, verbatim: preflight -> typecheck -> biome -> rustfmt/clippy -> TS+Rust tests -> gen freshness.
      - run: pnpm verify
