# The RELEASE workflow (WP12e — build-wp12-updater.md §4, D4–D8, D11, D12; EDP §12; TD-3). Its shape:
#   plan → verify (THE gate) → build (matrix) → sign → converge → attest → publish.
#
# HONEST LIMIT: this workflow cannot run on the developer's Mac. Its witnesses are its scripts' tests
# (`packages/electron-shell/test/updates/release-scripts.test.ts`) and a workflow lint (actionlint, plus the
# structure test beside the scripts). Its first real run is James's (J3), and it is red until the sibling pins are on
# their remotes: CI fetches every sibling checkout from its remote (`.github/actions/prepare-*`).
#
# PERMISSIONS (EDP §12.2; the PM's ruling 2026-10-15 14:47Z) — nothing at the top; each job states its own:
#   job        environment        permissions                          secrets (step-scoped)
#   plan       —                  contents: read, actions: read        none
#   tag        —                  contents: write                      none (GITHUB_TOKEN only)
#   verify     —                  contents: read                       none (verify.yml, called)
#   build      release-signing    contents: read                       VIBEFIELD_BUNDLED_INDEX_SECRET in the stage step;
#                                                                      the Apple credentials in the signed-package step
#   sign       release-signing    contents: read                       VIBEFIELD_RELEASE_SECRET in the sign step
#   converge   —                  contents: read                       none
#   attest     —                  contents: read, id-token: write,     none (GITHUB_TOKEN and the run's OIDC token, to
#                                 attestations: write                  the pinned attest action alone — LP-1)
#   publish    —                  contents: write                      none (GITHUB_TOKEN only)
# Only tag and publish write contents. attest writes attestations alone, and is the one job that may mint an OIDC token
# (Sigstore's signing identity): it runs no checkout, no install and no repository code (LP-1, 2026-11-05).
# GitHub's required reviewers gate EVERY deployment to `release-signing`, so a SCHEDULED
# nightly waits for an approval at the build job and again at the sign job (J2: "daily when approved" until James rules).
# THE TAG IS MADE AT PLAN TIME (2026-10-26, VF-PM's ruling A): GitHub refuses GITHUB_TOKEN a tag at a commit whose
# .github/workflows differ from main's head, and the first signed nightly (run 40342606623) met that twice at publish
# (HTTP 403, 17:03Z and 17:23Z) after a push changed workflows. The `tag` job makes it while the planned commit IS main's
# head; publish asserts it and creates the release on it. A red nightly leaves its tag with no release.
#
# TRIGGERS: a schedule and a manual dispatch make a NIGHTLY (`nightly-YYYYMMDD[.N]`, skipped when main is red or unchanged
# since the last nightly — RL4 (a)); manual dispatch can make a numbered revision on the same day. A pushed `v*` tag makes a BETA (`vX.Y.Z-beta.N`) or a STABLE (`vX.Y.Z`), whose
# version must already be committed (RM-D7). The `v*` ruleset keeps those tags human; `nightly-*` tags are created by
# the publish job (D7, J2).
#
# NO SECRET, NO METADATA (D8): without VIBEFIELD_RELEASE_SECRET the sign step publishes no `latest*.yml` and nothing
# update-visible; the installers stay downloadable by hand and the run says so. Until J4 (Apple), a macOS build is
# UNSIGNED and says so; its feed can still be verified and refused (W10), but Squirrel.Mac cannot apply it.
name: release

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC — off the hour, where GitHub's schedule queue is quietest
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time, never cancelled half-way: an interrupted publish is a burned tag (EDP §12.4).
concurrency:
  group: release
  cancel-in-progress: false

env:
  # cache-free, reproducible builds (EDP §12.1): no Nx cache, no incremental Rust
  NX_SKIP_NX_CACHE: "true"
  NX_DAEMON: "false"
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      reason: ${{ steps.plan.outputs.reason }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      makeLatest: ${{ steps.plan.outputs.makeLatest }}
      commit: ${{ steps.plan.outputs.commit }}
      # AU-6 (LC-18): the plan time, ISO UTC; the stage steps write it into the identity as `builtAt`
      builtAt: ${{ steps.plan.outputs.builtAt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the nightly tags, to find the last nightly's commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Main's state (nightlies only)
        id: main
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # green = the verify run of THIS commit on main succeeded (a commit verify has not finished on is not green)
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify.yml --branch main --commit "$SHA" \
            --limit 1 --json conclusion --jq '.[0].conclusion // empty')
          if [ "$conclusion" = "success" ]; then echo "green=true" >> "$GITHUB_OUTPUT"; else echo "green=false" >> "$GITHUB_OUTPUT"; fi
          # Version order keeps revision .10 after .9. A lightweight tag's creatordate is its commit's.
          last=$(git tag --list 'nightly-*' --sort=-version:refname | head -n 1)
          if [ -n "$last" ]; then echo "lastTag=$last" >> "$GITHUB_OUTPUT"; fi
          # the newest PUBLISHED nightly: "unchanged" is judged against it, never against a tag a red nightly left
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isDraft,createdAt \
            --jq '[.[] | select(.isDraft | not) | select(.tagName | startswith("nightly-"))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -n "$published" ]; then
            echo "lastPublishedCommit=$(git rev-list -n 1 "$published")" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan the release (D6, D7, D14)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          MAIN_GREEN: ${{ steps.main.outputs.green || 'true' }}
          LAST_TAG: ${{ steps.main.outputs.lastTag }}
          LAST_PUBLISHED_COMMIT: ${{ steps.main.outputs.lastPublishedCommit }}
        run: |
          node scripts/release-plan.mjs --event "$EVENT" --ref "$REF" --commit "$SHA" --main-green "$MAIN_GREEN" \
            --last-nightly-tag "$LAST_TAG" --last-published-nightly-commit "$LAST_PUBLISHED_COMMIT" \
            --github-output "$GITHUB_OUTPUT"
      - name: Say a skipped nightly
        if: steps.plan.outputs.skip == 'true'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: echo "::notice title=No nightly today::$REASON"

  # The run's tag, made right after plan while the planned commit is main's head, and before verify, so a re-run
  # continues on the same tag (2026-10-26, ruling A). Idempotent at that commit; refused, in words, anywhere else. A
  # pushed beta or stable tag is already there, so for those runs this only asserts it.
  tag:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The tag, at the planned commit (D7 — used once)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq "map(select(.ref == \"refs/tags/$TAG\")) | length")
          existing=""
          if [ "$refs" != "0" ]; then existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq .sha); fi
          action=$(node scripts/release-plan.mjs tag --tag "$TAG" --commit "$COMMIT" --existing "$existing")
          if [ "$action" = "create" ]; then
            if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" >/dev/null; then
              echo "::error title=Tag refused::GitHub refuses GITHUB_TOKEN a tag at a commit whose .github/workflows differ from main's head: has main moved since this run was planned? (git diff --stat $COMMIT origin/main -- .github/)"
              exit 1
            fi
          fi
          echo "tag: $TAG at $COMMIT ($action)"

  verify:
    needs: [plan, tag]
    if: needs.plan.outputs.skip != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  build:
    needs: [plan, tag, verify]
    if: needs.plan.outputs.skip != 'true'
    environment: release-signing
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS universal on one arm64 runner is EDP-22's target; until its amendment lands, arm64 alone
          - platform: mac-arm64
            runner: macos-15
            out: mac-arm64
    runs-on: ${{ matrix.runner }}
    # The toolchain is PINNED, like rust-toolchain.toml (2026-10-26, VF-PM 04:06Z): the first signed nightly
    # (run 40262280678) failed at "Package, signed" because run-electron-builder.mjs needs full Xcode 26 with Icon
    # Composer, and the image `macos-15-arm64` 20260907.0337 defaults to Xcode 16.4 (`xcode-select -p`, also
    # /Applications/Xcode.app), with 26.3/26.2/26.1.1/26.0.1 installed by versioned name. One job-level line serves every
    # step, the unsigned path's "Package, UNSIGNED" as much as the signed one. When an image rotates this Xcode away,
    # the resolver's own refusal ("DEVELOPER_DIR does not identify Xcode 26 with Icon Composer") is the guard, never a
    # silent fallback. The matrix's move to macos-26 (default Xcode 26.6, the dev Mac's) is ROADMAP's follow-on.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # LP-6b (item 170): THE release switch — every shipped native build in this job remaps its build paths
      # (scripts/build-paths.mjs); set nowhere else, so a development build keeps its cache
      VIBEFIELD_REMAP_BUILD_PATHS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
      # The sibling checkouts at their pinned revisions, from their remotes, as verify.yml prepares them — and red until
      # they are pushed (J3). No dependency or build cache anywhere in a release build (EDP §12.1).
      - name: Fetch sibling checkouts at the pinned revisions (EL8, siblings.lock.json)
        run: |
          set -euo pipefail
          for name in rosetta; do  # puppeteer: released on npm since 2026-10-26, no checkout
            node scripts/siblings.mjs fetch "$name"
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # EL8: the compiler is rust-toolchain.toml's. A bare `rustup toolchain install` installs the active toolchain — the
      # file's channel, components and profile — so CI and the Mac read ONE declaration (2026-10-21: a `stable`-branch
      # action installed the day's stable, and rustc 1.99.1's clippy reddened main while the Mac held 1.97.1).
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          [ -n "${CARGO_INCREMENTAL+set}" ] || echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          [ -n "${CARGO_TERM_COLOR+set}" ] || echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
          rustc --version --verbose
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      # Electron 43 has no postinstall, so the install leaves no binary; the stager copies Electron's licences out of its
      # dist/ (LP-5's notices), and nothing else here fetches it. verify's step, verbatim (item 240, run 42398362320).
      - name: Electron's binary (its own install.js; path.txt and an executable binary)
        run: node scripts/electron-binary.mjs
      - uses: ./.github/actions/prepare-mille
      - name: Build rosettad and the Ghosttea renderer from their pinned siblings
        run: pnpm siblings:build
      # field-native's release build is NOT a step here: `package:stage` runs THE one entry, `build:native-release`
      # (apps/desktop/packaging/build-native-release.mjs: --locked; no C harfbuzz since ghosttea 0.13.5), on the signed path and the unsigned
      # path alike (BP-1b, 2026-10-26; a second site is the drift the host-links gate would catch).
      - name: Stamp the nightly's version (D6 — this checkout only, never committed)
        if: needs.plan.outputs.channel == 'nightly'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release-plan.mjs stamp --version "$VERSION"
      # GitHub's macOS network can drop stapler's HTTP/3 ticket lookup with NSURLError -1005.
      # Keep Apple's signing/notarization checks; force HTTPS over TCP on this ephemeral runner only (the one copy is the
      # composite; converge runs it too, before its own ticket lookups — LP-1's review).
      # https://github.com/actions/runner-images/issues/14924
      - name: Use TCP for Apple notarization tickets
        if: runner.os == 'macOS' && vars.VIBEFIELD_MAC_SIGNING == 'true'
        uses: ./.github/actions/apple-tickets-over-tcp
      # package:mac:release (run-macos-release.mjs): electron-builder signs, notarizes and staples the APP; then, with the
      # same credentials in this step alone, packaging/notarize-dmg.mjs signs the DMG (the same Developer ID, a secure
      # timestamp), notarizes it as the outermost container, staples and assesses it, and re-reads latest-mac.yml's DMG
      # entry from the stapled bytes, its blockmap dropped (LP-1). Everything after this step reads the final DMG.
      - name: Package, signed (J4 — the Apple credentials exist)
        if: vars.VIBEFIELD_MAC_SIGNING == 'true'
        working-directory: apps/desktop
        env:
          VIBEFIELD_RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
          VIBEFIELD_BUILT_AT: ${{ needs.plan.outputs.builtAt }}
          VIBEFIELD_BUNDLED_INDEX_SECRET: ${{ secrets.VIBEFIELD_BUNDLED_INDEX_SECRET }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          APPLE_API_KEY="$key" pnpm run package:mac:release
          rm -f "$key"
      - name: Stage, release-keyed (TD-3 — the bundled index is signed here)
        if: vars.VIBEFIELD_MAC_SIGNING != 'true'
        working-directory: apps/desktop
        env:
          VIBEFIELD_RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
          VIBEFIELD_BUILT_AT: ${{ needs.plan.outputs.builtAt }}
          VIBEFIELD_BUNDLED_INDEX_SECRET: ${{ secrets.VIBEFIELD_BUNDLED_INDEX_SECRET }}
        run: |
          pnpm run package:stage
          node ../../scripts/stage-package.mjs --verify --require-complete --require-release-key
      - name: Package, UNSIGNED (until J4 — Squirrel.Mac cannot apply this build)
        if: vars.VIBEFIELD_MAC_SIGNING != 'true'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          echo "::warning title=Unsigned macOS build::no Apple credentials (J4): this build installs by hand and cannot apply through Squirrel.Mac"
          node packaging/run-electron-builder.mjs --mac --arm64 --config packaging/electron-builder.yml
      # run-macos-release.mjs's own post-package checks, minus the signature requirements it adds for a signed build
      - name: The packaged app's checks (as package:mac:release runs them, unsigned)
        if: vars.VIBEFIELD_MAC_SIGNING != 'true'
        working-directory: apps/desktop
        env:
          OUT: ${{ matrix.out }}
        run: |
          set -euo pipefail
          app="release/$OUT/VibeField.app"
          node packaging/verify-files-package.mjs --native-root "$app/Contents/Resources/bin"
          node packaging/verify-history-package.mjs --native-root "$app/Contents/Resources/bin"
          node packaging/verify-agents-package.mjs --native-root "$app/Contents/Resources/bin"
          node packaging/verify-plugins-package.mjs --app "$app" --require-release-key
          node packaging/verify-live-surface-release.mjs --app "$app" --enumerate-only
          # LP-1: no credentials, so the DMG is not signed, notarized or stapled — it says so; the feed's DMG entry is
          # still re-read from its bytes and its blockmap dropped, so both paths publish the same set of names
          node packaging/notarize-dmg.mjs --dir release --unsigned
      # BP-1b's gate on the packaged app, signed or not (the stage's verify ran it on the stage): every Mach-O — field-native,
      # its cell, the sidecar, Electron's helpers, every .node and .dylib — loads only /usr/lib, /System or the bundle's own
      # paths, and the native binaries START (`--version`, under the hardened runtime once signed). Nothing else in this job
      # loads field-native; a native plane that cannot start never publishes green.
      - name: No host libraries, and the native plane starts (BP-1b)
        env:
          OUT: ${{ matrix.out }}
        run: node scripts/host-links.mjs --app "apps/desktop/release/$OUT/VibeField.app"
      # electron-builder writes app-update.yml only for a dmg or zip target (PublishManager.js:77-80): asserted here, on the
      # release build's app — never on package:dir's (W8, corrected 2026-10-15)
      - name: The update config (B8 — app-update.yml present, provider github, no token)
        env:
          OUT: ${{ matrix.out }}
        run: node scripts/audit-app-update.mjs --app "apps/desktop/release/$OUT/VibeField.app"
      - name: The asar allowlist (D12)
        env:
          OUT: ${{ matrix.out }}
        run: node scripts/audit-asar.mjs --app "apps/desktop/release/$OUT/VibeField.app" --stage-app apps/desktop/build/stage/app
      - name: Hash the planes (D11)
        env:
          PLATFORM: ${{ matrix.platform }}
          OUT: ${{ matrix.out }}
          # TD-4: "true" on the signed macOS path alone (a field-native member read by its bytes fails it), else empty
          SIGNED_MAC: ${{ runner.os == 'macOS' && vars.VIBEFIELD_MAC_SIGNING == 'true' && 'true' || '' }}
        run: |
          mkdir -p release-build
          node scripts/release-manifest.mjs hash ${SIGNED_MAC:+--require-cdhash} --app "apps/desktop/release/$OUT/VibeField.app" --platform "$PLATFORM" \
            --out "release-build/hashes-$PLATFORM.json"
          # the payloads and the UNSIGNED feed electron-builder wrote beside them (the sign job signs it, D8); the DMG is
          # already stapled and its feed entry re-read (LP-1). The zip's blockmap rides for differential downloads; a
          # DMG's never does (stale once stapled, read by nothing: electron-updater updates a Mac from the zip)
          find apps/desktop/release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.zip.blockmap' -o -name '*.dmg' \
            -o -name 'latest*.yml' \) -exec cp {} release-build/ \;
          ls release-build/latest*.yml >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.platform }}
          path: release-build/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: read
    steps:
      # AU-6: the whole history, so the notes step can read the log since the channel's previous release. History is
      # data, not code: this job still runs no lifecycle script beside the release key (below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # release-verify runs the client's chain from source; it needs zod and nothing else (its loader maps the two
      # workspace packages to their sources). No lifecycle script runs in the job that holds the release key.
      - name: Install the chain's one dependency (contracts → zod; frozen, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts --prod --filter @vibefield/contracts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: builds
      # D4/D5 carry from the newest SIGNED release (an unsigned one publishes no metadata, D8), whatever its channel:
      # every release carries every channel's policy and all three heads. D11's `touched` compares with the newest
      # release of THIS channel. A failed download fails the job — never a silent first release.
      - name: The previous releases' truth (D4, D5, D11)
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p previous previous-channel release-out
          case "$CHANNEL" in
            nightly) same='^nightly-[0-9]{8}([.][1-9][0-9]*)?$' ;;
            beta) same='^v[0-9]+[.][0-9]+[.][0-9]+-beta[.][0-9]+$' ;;
            stable) same='^v[0-9]+[.][0-9]+[.][0-9]+$' ;;
            *) echo "unknown channel $CHANNEL"; exit 1 ;;
          esac
          heads=""
          manifest=""
          while IFS= read -r tag; do
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if [ -z "$heads" ] && grep -qx 'channels.json' <<<"$assets"; then heads=$tag; fi
            if [ -z "$manifest" ] && [[ "$tag" =~ $same ]] && grep -qx 'release-manifest.json' <<<"$assets"; then manifest=$tag; fi
            if [ -n "$heads" ] && [ -n "$manifest" ]; then break; fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName')
          if [ -n "$heads" ]; then
            gh release download "$heads" --repo "$GITHUB_REPOSITORY" --dir previous \
              --pattern 'channels.json' --pattern 'update-policy.*.json'
            echo "::notice title=Carried from $heads::the D4 heads and the D5 policy versions"
          else
            echo "::notice title=First signed release::no release carries channels.json yet; the heads start here (D4)"
          fi
          if [ -n "$manifest" ]; then
            gh release download "$manifest" --repo "$GITHUB_REPOSITORY" --dir previous-channel --pattern 'release-manifest.json'
          fi
          # download-artifact v8 extracts a single matched artifact directly into builds/;
          # multiple matches get named subdirectories. Accept both layouts.
          find builds -mindepth 1 -maxdepth 2 -type f ! -name 'hashes-*.json' -exec cp {} release-out/ \;
      # AU-6 (AU-D10 A; LC-19): the notes, from the SAME previous manifest Merge names in `previous`, written beside the
      # release (never an asset of their own) and merged INTO the manifest, so they ride under its one release
      # signature. A stable refuses here without apps/desktop/packaging/notes/<X.Y.Z>.txt; a first release of its
      # channel writes none. No secret: git's history and the committed notes are all it reads.
      - name: The notes (AU-6 — signed with the manifest)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          node scripts/release-notes.mjs --channel "$CHANNEL" --version "$VERSION" --commit "$COMMIT" --tag "$TAG" \
            --previous previous-channel/release-manifest.json --out notes.json
      - name: Merge the planes (D11)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          hashes=$(find builds -name 'hashes-*.json' | sort | paste -sd, -)
          node scripts/release-manifest.mjs merge --hashes "$hashes" --version "$VERSION" --tag "$TAG" \
            --channel "$CHANNEL" --commit "$COMMIT" --previous previous-channel/release-manifest.json \
            --notes notes.json --out release-out/release-manifest.json
      - name: Sign (TD-3, D8 — the release key, in this step alone)
        env:
          VIBEFIELD_RELEASE_SECRET: ${{ secrets.VIBEFIELD_RELEASE_SECRET }}
          TAG: ${{ needs.plan.outputs.tag }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          node scripts/release-sign.mjs --dir release-out --tag "$TAG" --channel "$CHANNEL" \
            --run "$GITHUB_RUN_NUMBER" --previous previous
      - name: Verify with the client's own chain (D8)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: node scripts/release-verify.mjs --dir release-out --tag "$TAG" --channel "$CHANNEL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-out
          path: release-out/
          if-no-files-found: error
          retention-days: 7

  converge:
    needs: [plan, sign]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the chain's one dependency (contracts → zod; frozen, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts --prod --filter @vibefield/contracts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-out
          path: release-out
      # LP-1: the stable channel's fixed-name download, a byte copy of this release's (stapled) DMG, so
      # https://github.com/vibefield/vibefield/releases/latest/download/VibeField-mac-arm64.dmg always resolves (only a
      # stable is GitHub's `latest`, D4). Made before the verify (which holds it to the versioned DMG's bytes) and the
      # checksums (which list it). Never for a nightly or a beta; the verify refuses one that carries it.
      - name: The stable download's fixed name (LP-1 — stable only)
        if: needs.plan.outputs.channel == 'stable'
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release-assets.mjs alias --dir release-out --channel "$CHANNEL" --version "$VERSION"
      - name: Verify again, on the bytes about to be published (D8)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: node scripts/release-verify.mjs --dir release-out --tag "$TAG" --channel "$CHANNEL"
      - name: The published zip's nested signatures (EDP §16.1)
        run: |
          zip=$(find release-out -maxdepth 1 -name '*mac*.zip' | head -n 1)
          if [ -z "$zip" ]; then echo "no macOS zip in this release"; exit 0; fi
          mkdir -p unzipped && ditto -x -k "$zip" unzipped
          app=$(find unzipped -maxdepth 2 -name '*.app' | head -n 1)
          if codesign --display "$app" >/dev/null 2>&1; then
            codesign --verify --deep --strict --verbose=2 "$app"
          else
            echo "::warning title=Unsigned macOS build::the published zip is unsigned (J4); the nested-signature audit runs once it is signed"
          fi
      # LP-1's review: stapler validate and Gatekeeper's assessment below look the ticket up at Apple, the same HTTP/3
      # path build's copy of this step guards (862e2e5da), so converge routes it over TCP too, before the lookups.
      - name: Use TCP for Apple notarization tickets
        if: runner.os == 'macOS' && vars.VIBEFIELD_MAC_SIGNING == 'true'
        uses: ./.github/actions/apple-tickets-over-tcp
      # LP-1: the DMG a stranger downloads, on the bytes about to be published (the stable alias too): the team's
      # Developer ID with a secure timestamp, a stapled ticket, and Gatekeeper's `open` assessment accepting it. Strict
      # whenever the app inside carries a Developer ID signature — a signed app in an unsigned DMG was
      # nightly-20261028's defect. "Signed at all" is not the question: an unsigned build's app is ad-hoc signed too
      # (after-pack.mjs's fuse flip re-signs it `codesign --sign -`), so only a Developer ID Application authority on the
      # app makes this strict (LP-1's review, 2026-11-05).
      - name: The published DMG is signed, notarized and stapled (LP-1)
        run: |
          set -euo pipefail
          app=""
          if [ -d unzipped ]; then app=$(find unzipped -maxdepth 2 -name '*.app' | head -n 1); fi
          if [ -z "$app" ]; then echo "no macOS app in this release"; exit 0; fi
          signature=$(codesign --display --verbose=2 "$app" 2>&1 || true)
          if grep -q '^Authority=Developer ID Application: ' <<<"$signature"; then
            node apps/desktop/packaging/notarize-dmg.mjs --dir release-out --validate-only
          else
            echo "::warning title=Unsigned macOS build::the published app carries no Developer ID signature (J4), so neither does its DMG; both are signed, notarized and stapled once the build is"
          fi
      # After every byte is final (the DMG stapled in build, its alias made above), so the sums are the published bytes'.
      - name: Checksums
        run: |
          cd release-out
          for file in *; do
            shasum -a 256 "$file"
          done > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-final
          path: release-out/
          if-no-files-found: error
          retention-days: 7

  # LP-1: build provenance for the bytes a person downloads (`gh attestation verify <file> --repo vibefield/vibefield`):
  # the DMG (the stable alias is the same digest) and the zip, exactly as converge left them for publish, signed through
  # Sigstore with this run's OIDC identity and stored by GitHub's attestations API. A job of its own, so the token that
  # can mint that identity reaches the pinned action alone: no checkout, no install, no repository code runs here.
  # Before publish, so a published release always has its provenance.
  attest:
    needs: converge
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-final
          path: release-out
      - name: Build provenance for the DMG and the zip (LP-1)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-out/*.dmg
            release-out/*.zip

  publish:
    needs: [plan, converge, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-final
          path: release-out
      # The tag job made the tag at plan time; a release is created ON it, never by targeting a commit (2026-10-26)
      - name: The tag points at the planned commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          at=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq .sha)
          if [ "$at" != "$COMMIT" ]; then
            echo "::error title=Tag moved::$TAG points at $at, not at the planned commit $COMMIT"
            exit 1
          fi
      # EDP §12.4's transaction: a draft, the payloads, the metadata LAST, then the un-draft. Immutable Releases makes
      # every asset final at the un-draft, so the expected assets are checked on the draft first.
      - name: Draft, payloads, then metadata last
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "VibeField $VERSION" --notes "VibeField $VERSION ($TAG).")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          cd release-out
          payloads=()
          metadata=()
          for file in *; do
            if [[ "$file" =~ ^(latest.*\.yml|channels\.json|update-policy\..*\.json|release-manifest\.json|trust-root\.json)(\.sig)?$ ]]; then
              metadata+=("$file")
            else
              payloads+=("$file")
            fi
          done
          if [ "${#payloads[@]}" -gt 0 ]; then gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${payloads[@]}"; fi
          if [ "${#metadata[@]}" -gt 0 ]; then gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${metadata[@]}"; fi
      - name: The expected assets, on the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > remote.txt
          find release-out -maxdepth 1 -type f -exec basename {} \; | sort > local.txt
          diff -u local.txt remote.txt
      - name: Publish (the un-draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          LATEST: ${{ needs.plan.outputs.makeLatest }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$LATEST"
      - name: Nightly retention (RL4 — delete nightly RELEASES older than 14 days, keep their tags)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # the newest nightly always stays, however old: the nightly channel's head must resolve
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"nightly-\"))] | sort_by(.createdAt) | reverse | .[1:] | .[] | select(.createdAt < \"$cutoff\") | .tagName" |
            while read -r old; do
              # never --cleanup-tag: an immutable release's tag name is burned, and the nightly-* ruleset keeps it (D7)
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes
            done
