# WP12e (build-wp12-updater.md §4; EDP §12.2): every third-party action is pinned to a reviewed commit SHA, with its
# version in a trailing comment; Dependabot proposes the next SHA as a pull request, so a pin moves only by review.
# The Rust toolchain is no action: rust-toolchain.toml declares it and each workflow's step is a bare `rustup toolchain
# install` (EL8, 2026-10-21), so no pin here is moved by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
