  # Rebuild with `npm run build --workspace @vibecook/ghosttea-react` in that
  # checkout after edits. Exit: a published release carrying these fixes.
  "@vibecook/ghosttea-react": link:../ghosttea-0.11.2/packages/ghosttea-react
  "@vibecook/puppeteer-runtime": link:../puppeteer/packages/runtime
  "@vibecook/puppeteer-builtin-providers": link:../puppeteer/packages/builtin-providers
  "@vibecook/puppeteer-core": link:../puppeteer/packages/core
  "@vibecook/puppeteer-record": link:../puppeteer/packages/record
  "@vibecook/puppeteer-monitor": link:../puppeteer/packages/monitor
  # MV-3a (2026-10-03): the monitor-view contract (`/model` is the model fieldd's
