  # 2026-10-07 bumped 0.15.0-desk.5 → 0.15.0-desk.6 (DK-17b) — desk.5 and I35,
  # I37, I40, I41, I42, I43, the migration's last prerelease (ICE CHANGELOG:
  # I43 an empty presence sweep wakes no lone desk; I41 `frame.onParked`, the
