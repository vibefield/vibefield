packages:
  - "packages/*"
  # plugins live at the repo ROOT (plugin spec §5.1/PA-35): product actors beside
  # the platform, not inside it; examples/ holds dev/reference packs (the desk clock,
  # the behavior-conformance carrier, the kv service).
  - "plugins/*"
  - "examples/plugins/*"
  # authoring kit (plugin spec §5.4): build/check tooling, never host code.
  - "tooling/*"
  - "apps/*"
  - "services/*"
allowBuilds:
  esbuild: true
  electron: true
  # electron-builder's Windows-installer helper. Refused rather than merely
  # unaddressed: Windows is not a GA target (EDP-23), nothing on macOS or Linux
  # needs it, and a postinstall we never exercise is install-time code we cannot
  # vouch for. Flip it in the slice that first builds an NSIS installer.
  electron-winstaller: false
  # Nx validates its native binary for the current platform. Nx Cloud is not
  # configured, so its guarded postinstall performs no network setup.
  nx: true
# EL8 — exactly ONE loro-crdt resolution across the whole tree (strata/ICE/app;
# CRDT docs are only interoperable within a single wasm instance).
# @vibecook/ice: EXACT registry pin (EL8: "exact pins on all @vibecook/*"),
# declared ONCE here — packages specify "*". Publishing became real at ice 0.2.0
# (2026-07-25), retiring the machine-coupled `file:` checkout this line used to
# carry: a SHA that drifted on every upstream commit, blocked preflight, and made
# a stale sibling dist a live bug class. Upgrades are now an explicit version
# edit. To co-develop ICE, link it locally and DO NOT commit that:
#   pnpm link ../infinite-canvas-engine/packages/ice   (undo: pnpm unlink)
overrides:
  # Floor tracks the highest floor any consumer declares — ICE 0.2.0 requires
  # ^1.13.8 (ordered ChildOf / document schema 2). An override BELOW a consumer's
  # floor silently wins, which is how the tree sat on 1.13.7 while ICE asked for
  # 1.13.8: the single-version law held, at the wrong version.
  loro-crdt: ^1.13.8
  # 2026-08-04 bumped 0.2.0 → 0.3.0 for the frame gate: `ce.frame.freeze`
  # parks the engine outright (no step, no reflectors, no rAF) where a stage hold
  # only quiets the GL compositor over a still-stepping world. Godview covers the
  # window, so the freeze is what its overlay wanted all along.
  # 2026-08-09 bumped 0.3.0 → 0.4.0 — petitions I1/I4/I5 land upstream: the
  # design-007 focus model (keyboard claim + wheel cede + keymapOverrides) and
  # the design-008 in-band prefab rename migration. Consumption retires the
  # ChromeLayer C-key capture trap, note's wheel stopPropagation pair, and the
  # C2 offline rename surgery (renamedFrom declarations replace it).
  # 2026-08-16 bumped 0.4.0 → 0.6.0. The registry skips 0.5.0: it was cut as a
  # release point but never published (0.6.0 landed the same day and superseded
  # it; a late publish would demote 0.6.0, since npm sets `latest` by publish
  # ORDER). Two of our petitions land in it — I14 `engine.guests` (the guest
  # runtime + the PA-28 circuit breaker, host-injectable ledger) and I15
  # `GuardedTx.move` (animation-integrated writes; closes the undo-mid-glide
  # PERMANENT-divergence hole at both chokepoints) — plus ICE's second product
  # surface, `defineBehavior` (design-009): declared schema + a REQUIRED store
  # class routing sync/undo/write-vocabulary/cadence. It also carries three
  # standing ICE bug fixes this field wants regardless of any of that: a
  # throwing publish hook no longer kills the rAF loop permanently,
  # self-removing publish hooks and reflectors no longer skip their neighbours,
  # and the devtools "reflect" lane reports for the first time. Strata rides to
  # 0.12.0 transitively (petitions #9 per-commit `meta`, #10 `valueEquals` +
  # `resourceStamp`). Additive on both sides — neither changelog has a Changed
  # or Breaking section. Unblocks PRC-4 (the `defineBehavior` generation
  # adapter) and the mind-map pack's layout behavior.
  # 2026-08-16 bumped 0.6.0 → 0.7.0 — petitions I16 + I17 land upstream: the
  # defineBehavior HOST contract (register(B, {orderKey?, ledger?}) with the
  # keyed lane; facade onGuestFault/onGuestNotice/onBehaviorFault/onBehaviorLog;
  # describeBehavior as the one definition-identity surface; thenable hooks as
  # attributed, frame-bounded faults) and ephemeral facet WITHDRAWAL on every
  # producer-stops edge (unregister / suspension / quarantine, deferred past
  # the tick when needed; BehaviorStatus.quarantined keeps the doctor honest).
  # Review-hardened pre-publish: six findings incl. a mid-tick-unregister
  # strand, all fixed + pinned. This is the release PRC-4b/4c gate on — the
  # behaviors adapter now builds against released types, not the scratch patch.
  # 2026-08-16 bumped 0.7.0 → 0.8.1 — petition I18 adds identity-bound
  # docs.attachPresence() after docs.open/create, including wake, teardown, and
  # tombstone inverses. 0.8.1 (not the intermediate 0.8.0) declares the exact
  # strata 0.13.0 edge and retires ICE's projection-unsafe-context cast against
  # strata's newly public getter. The exact npm pair passes the released I16–I18
  # matrix 10/10 and our Bundler-mode type consumer. ICE's emitted relative d.ts
  # specifiers remain non-NodeNext-portable; VibeField does not use NodeNext.
  # 2026-08-17 bumped 0.8.1 → 0.9.0 — petition I19 adds the identity-bearing
  # `maxFacetBytes` producer claim for ephemeral behavior facets. ICE measures
  # canonical UTF-8 JSON bytes of the complete raw cell and enforces the claim
  # before both default publication and runtime mutation. PRC-4g2 consumes that
  # local bound, then adds the host's aggregate transport-headroom admission.
  # 2026-08-25 bumped 0.9.0 → 0.10.0 for the first magnet-grid release.
  # 2026-08-25 bumped 0.10.0 → 0.11.0 — classic and magnet are complete
  # GridPassFactory implementations selected at build time. The published
  # package wires magnet only; GridMagnetConfig.enabled and the runtime renderer
  # switch are gone. Vibe Field defaults glyph:"dot", exposes dot/needle as
  # selected-pass tuning, and wires its runIf-gated cursor halo as an always-
  # live PoleSource.
  # 2026-10-03 bumped 0.11.0 → 0.14.0 — the desk (DK-1, desk/landing; DK-D12).
  # The registry skips 0.12.0 and 0.13.0 (cut, never published), so this one
  # event meets all three cuts' breaks (ICE CHANGELOG `[0.14.0]` › "Breaking,
  # at a glance"): `/r3f` and `/ground` are gone, `defineWidget` refuses the
  # DOM/R3F faces, and an object under the camera is a desk KIND drawn by one
  # WebGPU renderer. `three` and `@react-three/*` are no longer ICE peers, so
  # they leave the host singleton lists in this same event; strata stays
  # 0.13.0 and loro ^1.13.8 (ICE declares both exactly as before).
  # 2026-10-03 bumped 0.14.0 → 0.15.0-desk.1 — the nine 0.15.0 asks (DK-3,
  # desk/landing; DK-D12: an exact prerelease on `next` while the branch is
  # open, ICE CHANGELOG `[Unreleased]`). ADDITIVE but for I28's behaviour
  # change (a secondary button never acts): the capture door (I23), a kind's
  # faults contained and the missing face for a type with no kind (I24), the
  # mount's boot clock (I25), `cursors: false` (I26), the screen-point pick
  # (I27) and the hand's host options (I20–I22). strata 0.13.0 and loro
  # ^1.13.8 unchanged. A prerelease never satisfies a range, so the exact
  # string here IS the resolution; later prereleases are `0.15.0-desk.N`.
  # 2026-10-03 bumped 0.15.0-desk.1 → 0.15.0-desk.2 (DK-6) — desk.1 and I29's fix
  # (ICE CHANGELOG `### Fixed`: every pass converts device px by the attachment's
  # own ratio, so a capture at ANY scale draws every kind; at desk.1 a capture
  # below a device ratio of 1 drew two kinds of six). VibeField's DK-4
  # `captureScale` workaround retires with it. Nothing else moves; strata
  # 0.13.0 and loro ^1.13.8 unchanged.
  "@vibecook/ice": 0.15.0-desk.2
  # NF-0 (native-floor spec NF-D1): Ghosttea graduated to registry releases at
  # 0.6.0 (2026-07-29, one version across crates/npm/SwiftPM) — same EL8 posture
  # as ice above. fieldd consumes ghosttea-client since NF-3. NF-7 (2026-08-01)
  # bumped 0.6.0 → 0.7.0 with the cargo pin (G7/G8/G9 landings; one version law).
  # GT-3v (2026-08-04) bumped 0.8.0 → 0.9.0 for the shared terminal-appearance
  # system (renderer-true background opacity, the theme catalog, shader ports).
  # GT-3f (2026-08-04) bumped 0.9.0 → 0.9.1 — petition G11 landed upstream: an
  # `effects` prop makes shaders viewer-local like `theme`, and the appearance
  # DATA exports our Settings section is built from became a semver-protected
  # host contract.
  # GT-4 (2026-08-05) bumped 0.9.1 → 0.9.2. The release exists for the CARGO
  # side — it moves upstream's workspace to truffle-core =0.7.12 so field-native
  # can add ghosttea-truffle at all — and the npm rows move with it only to keep
  # the one-version law. Upstream's whole Rust delta across the two tags is one
  # test context string; nothing on this plane changed behaviour.
  # TC petitions (2026-08-18) bump 0.9.3 → 0.10.0 — the terminal-custody set
  # G15–G21 landed upstream in one release. THIS plane is where two are
  # consumed at the bump: the client validates + carries `scrollbackBytes`
  # behind protocol 1.15 and refuses older floors (G16), and wire refusals
  # reject as GhostteaRequestError{stage, code, osError} (G17) — fieldd's
  # terminal-service maps workloadClass → the genned class table and
  # classifies creates by typed code. The rest of the set is the TC-S6
  # compiler surface, cargo-side. All 0.10.0 artifacts (npm gitHead, crate
  # vcs-info, the v0.10.0 tag) agree at commit 43361e53.
  # G13 (2026-08-18) bumps 0.10.0 → 0.10.1 — the Windows env-strip case-fold
  # (EL7 defense-in-depth; box-confirmed leak closed) + process_tree hardening.
  # A cargo-side fix; the npm rows move to keep the one-version law. All
  # 0.10.1 artifacts agree at ad97fdb (signed tag v0.10.1).
  # G22/G23 (2026-08-23) bump 0.10.1 → 0.11.0 — the TPv3 cell/renderer bundle
  # (routed runtime, `encodeInput`, `ServiceSessions`); see Cargo.toml for the
  # full event note.
  # G24 (2026-08-23) bumps 0.11.0 → 0.11.1 — routed session events, the npm
  # half of this event: `ghosttea-react` gains host `getSession` (metadata
  # refresh armed from routed frame commits), `applySessionEvent` (the public
  # lifecycle door driving the same internal paths as the UDS events), and the
  # inbound extension mirror `onExtensionMessage` (+ the routed runtime's
  # `capabilities` advertisement). Cargo rows move in the same event.
  # GT-8b (2026-09-25) bumps 0.11.1 → 0.12.0 — terminal links: the runtime
  # platform's optional `openExternal` (links surface only when a host supplies
  # it), `terminalLinkUrl`, and the loader APPLIES Ghostty's `link-url`. A 0.x
  # minor, not 0.11.2: the release adds public fields to two published Rust
  # structs. Cargo rows move in the same event.
  "@vibecook/ghosttea-client": 0.12.0
  # GT-0 (2026-08-01): the Godview terminal planes join at the same exact version
  # (one-version law) — electron-shell consumes ghosttea-electron, field-app
  # consumes ghosttea-react; packages ask for "*".
  "@vibecook/ghosttea-electron": 0.12.0
  # GT-3m (2026-08-04): field-app declares the wire vocabulary directly — the
  # monitor's rows ARE floor sessions, so `SessionSummary` is the honest type for
  # them. Types-and-constants only (zero dependencies), already resolved at this
  # version transitively; declaring it puts it under the one-version law rather
  # than leaving a hoisted transitive to drift.
  "@vibecook/ghosttea-protocol": 0.12.0
  # ---- SIBLING MODE (AR-0, 2026-09-12) --------------------------------------
  # chopsticks and spaghetti retired on 2026-09-04 (James): the agent runtime is
  # puppeteer, agent history is rosetta. Neither is published, so they enter as
  # `link:` rows to SIBLING CHECKOUTS beside this repo, pinned by revision in
  # siblings.lock.json — preflight verifies presence, revision, dirtiness (warn),
  # and that this block agrees with the lock (scripts/siblings.mjs is the one
  # reader). Only DIRECTLY imported packages are rows; transitive workspace:*
  # edges resolve inside puppeteer's own tree. Adapters are never rows and never
  # imports (AR-L1: VibeField knows no vendor; builtin-providers is the door —
  # walls R20–R22). Consumers ask for "*". A link: cannot promise its react peer
  # resolves to THIS tree's React by Node's resolution — it resolves the sibling's
  # copy. The answer (AR-5a, 2026-09-13) is the bundler's: the renderer's Vite
  # config and field-app's vitest config `dedupe` react/react-dom to this tree,
  # check:deps asserts the sibling's react VERSION is ours, and a field-app test
  # renders a package component with hooks (two Reacts throw there). That is
  # what admitted @vibecook/puppeteer-views (the Godview views, PU-5); the
  # puppeteer-react contract it extends stays transitive, never a row.
  # EXIT (W-D8): replace each row with an exact version, delete the lock
  # entries, drop electron-shell's sibling-mode `server.fs.allow` branch; the
  # walls and preflight's family rule stay.
  # Godview performance window (2026-09-27), revision in siblings.lock.json.
  # Rebuild with `npm run build --workspace @vibecook/ghosttea-react` in that
  # checkout after edits. Exit: a published release carrying these fixes.
  "@vibecook/ghosttea-react": link:../ghosttea-0.11.2/packages/ghosttea-react
  "@vibecook/puppeteer-runtime": link:../puppeteer/packages/runtime
  "@vibecook/puppeteer-builtin-providers": link:../puppeteer/packages/builtin-providers
  "@vibecook/puppeteer-core": link:../puppeteer/packages/core
  "@vibecook/puppeteer-record": link:../puppeteer/packages/record
  "@vibecook/puppeteer-monitor": link:../puppeteer/packages/monitor
  "@vibecook/puppeteer-views": link:../puppeteer/packages/views
  # rosetta's TypeScript client (types + the REST/WS client); rosettad itself is
  # built from the same checkout by `pnpm siblings:build` and reaches fieldd as
  # FIELDD_ROSETTAD_BIN, never through npm. The checkout is DEDICATED to the pin
  # (`../rosetta-pin`, 2026-10-03; `node scripts/siblings.mjs fetch rosetta`): James's
  # working checkout `../rosetta` is nothing this tree reads.
  "@rosetta/protocol": link:../rosetta-pin/clients/ts
  # AR-8c (2026-10-03) — rosetta's History room as a package (AR-D36; built
  # upstream as AR-8a, `clients/room`): the four columns, the panels and the
  # transcript behind injected ports, mounted in the frame's History slot. It
  # dials nothing — VibeField's adapters (field-app `history/doors.ts`) are its
  # ports. Its react/react-dom are PEERS (>=19 <20), deduped to this tree's
  # copy exactly as @vibecook/puppeteer-views is (the renderer's Vite config
  # and field-app's vitest config); its own install (`pnpm install
  # --frozen-lockfile` in that folder, its own lock) brings its dependencies
  # and a development React for its own typecheck.
  "@rosetta/room": link:../rosetta-pin/clients/room
# Shared dependency versions, declared ONCE — packages reference "catalog:".
catalog:
  "@tailwindcss/vite": ^4.0.0
  "@types/node": ^24.0.0
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  esbuild: ^0.28.1
  pino: 10.3.1
  react: ^19.2.7
  react-dom: ^19.2.7
  tailwindcss: ^4.0.0
  typescript: ^5.6.0
  vitest: ^3.0.0
minimumReleaseAgeExclude:
  - '@vibecook/strata-ecs@0.13.0'
  - '@vibecook/ice@0.15.0-desk.2'
  - '@vibecook/ghosttea-client@0.12.0'
  - '@vibecook/ghosttea-protocol@0.12.0'
  - '@vibecook/ghosttea-electron@0.12.0'
  - '@vibecook/ghosttea-react@0.12.0'
  - '@vibecook/ghosttea-frame@0.12.0'
  - '@vibecook/ghosttea@0.12.0'
  # AH-1b — the exact T2 release is a reviewed executable input, not an
  # unreviewed transitive update. All platform packages move in lockstep.
  # 0.7.12 → 0.7.14 (2026-09-16, UA-P-X): the RFC 025 petition window's exit.
  # This is the row that gives the PACKAGED app a login-gated node — the window
  # ran the FLOOR against a sibling-built sidecar but left apps/desktop on the
  # registry's protocol 4, and a gated node refuses a sidecar below protocol 5.
  # Root Cargo.toml's closure note carries the whole event.
  - '@vibecook/truffle-sidecar-darwin-arm64@0.7.14'
  - '@vibecook/truffle-sidecar-darwin-x64@0.7.14'
  - '@vibecook/truffle-sidecar-linux-arm64@0.7.14'
  - '@vibecook/truffle-sidecar-linux-x64@0.7.14'
  - '@vibecook/truffle-sidecar-win32-x64@0.7.14'
