  # ^1.13.8 unchanged. A prerelease never satisfies a range, so the exact
  # string here IS the resolution; later prereleases are `0.15.0-desk.N`.
  # 2026-10-03 bumped 0.15.0-desk.1 → 0.15.0-desk.2 (DK-6) — desk.1 and I29's fix
  # (ICE CHANGELOG `### Fixed`: every pass converts device px by the attachment's
