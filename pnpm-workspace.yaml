  # unchanged.
  # 2026-10-09 bumped 0.15.0 → 0.16.0-portals.2 (PORTALS PT-2) — a PRERELEASE
  # on `next` again, as DK-3…DK-17b were (portals.1 was cut, never published):
  # ICE `826acc8` on `portals/lt2`, CHANGELOG `[Unreleased]`. M24 LT1, the live
  # face (design-019): `createLiveTexture` (the host's writer), `LIVE`/
  # `LiveSources`/`LiveFace` and its words, `createSight`, `liveDepth`,
