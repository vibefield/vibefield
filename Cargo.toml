[workspace]
resolver = "2"
members = ["packages/field-native"]

[workspace.dependencies]
# EL8 — version lockstep: exactly one truffle-core revision across every crate in
# this workspace (a borrowed Arc<Node> is type-incompatible across revisions), and
# the pin is EXACT — upgrades are deliberate events, never `cargo update` drift.
# Registry pin since 2026-07-28 (the T1 petition window closed with truffle 0.7.9);
# the ../p008/truffle sibling [patch.crates-io] returns only for the duration of an
# active petition window, together with its siblings.lock.json pin (see git history).
truffle-core = "=0.7.11"
# NF-0 (native-floor spec NF-D1): ghosttea graduated to crates.io the same way,
# 2026-07-29 — exact pin, upgrades are deliberate events. The published
# ghosttea-truffle 0.6.0 requires truffle-core =0.7.11, so the Arc<Node> shared
# with the mesh adapter stays ONE type alongside the pin above. `ghosttea` itself
# carries no truffle dep; field-native consumes it at NF-2, ghosttea-truffle at
# NF-remote — until then this is the declared version choice, not a lock entry.
ghosttea = "=0.6.0"
