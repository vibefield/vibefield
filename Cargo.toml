#   · 0.7.17 — T6 (7b66411): a WebSocket upgrade through a bound route keeps the
#     target's path and query, so a PACKAGED app admits the phone's product hello.
#     The local override sidecar retires with it.
#   · after 0.7.17 — the macOS per-connection stall and the 30 s dial hangs
#     (7ef088e), device approval and a late-known login
#     (NodeBuilder::on_network_status, c78e868), a restarted peer's session
#     recovered promptly with one dial per peer (9eb8ddc, the session rewrite
#     under the synced store), `VERSION` and `Node::sidecar_pid` (68a967c).
# Its sidecar speaks PROTOCOL 8, which adds no command: only a repeated "running"
# status once the node's own login is known after a fast restart. The core gates
# nothing on >= 8 (its gates stay 5 login, 6 UDP/QUIC, 7 egress), and the
# node-to-node wire reads unchanged (QUIC PROTOCOL_VERSION 1, the WS hello, the
# synced store), so a phone or a second desktop still on 0.7.14 is EXPECTED to
# talk to this one. That rests on a reading: 9eb8ddc rewrote the session layer
# under the roster and the store, and its mixed-version behaviour has one
# witness, field-native's mixed-version probe, which this bump adds (a 0.7.19
# node and an older peer, through both restarts). field-native needs NO source
# change to build at its default features: every truffle API it calls is
# unchanged or only grew (read at the tag, call site by call site; the build is
# the check).
# The SwiftPM vice is UNCHANGED: ghosttea's newest Swift tag (v0.12.0) and its
# pinned 218e11f still declare truffle exact 0.7.12, so forward to 0.7.19 is as
# unsatisfiable as forward to 0.7.14 was. The path package stays, and only the
# checkout behind it moves (siblings.lock.json → 1218b64; Package.swift's
# truffleRelease stays nil).
# CLOSED 2026-10-23 (the EL8 to ghosttea 0.13.1 — G28's exit): ghosttea v0.13.1
# (ee3b721e) declares truffle exact 0.7.19, this pin, so the vice opened on its
# forward jaw. siblings.lock.json records truffle's `release.swift` = "0.7.19",
# the kit's `truffleRelease` renders it, and Package.resolved carries truffle
# 0.7.19 (1218b64). `.window/truffle` stays as the dev overlay's link, and a build
# no longer needs `../truffle-rfc025`. Every plane names 0.7.19 by version now;
# the exit list this note kept is empty.
#
# THE BUMP TO 0.7.22 (2026-10-25; James, via VF-PM 23:52Z: "go with your lean" —
# ONE EL8 event with ghosttea 0.13.4, because ghosttea through 0.13.3 declares
# truffle-core =0.7.19 on its cargo AND Swift planes, so neither moves alone).
# `truffle-v0.7.22` = f7e3900d. The crate and the five npm sidecars move
# together, as at 0.7.19. What it carries past 0.7.19:
#   · 0.7.20 — sidecar PROTOCOL 9 (WhoIs carries app capabilities, tags and the
#     user id; `ProxyConfig::accept_app_capabilities`) and PROTOCOL 10 (key
#     expiry, the control server and the sidecar's own exit as status events,
#     all on the #[non_exhaustive] `NetworkStatusEvent`); a headless-friendly
#     start (re-sent login URLs; `NodeBuilder::start_timeout`, whose default is
#     the 300 s 0.7.19 hard-coded, so an unchanged builder waits as long); the
#     bridge no longer holds its listener map across a send; the sidecar reaps a
#     bridged connection only when it is idle in BOTH directions.
#   · 0.7.21 — lock-only: ctutils 0.4.5 and tokio 1.53.3 (RUSTSEC-2026-0385 and
#     -0386), the sidecar built with Go 1.27.3 (CVE-2026-111943).
#   · 0.7.22 — TailscaleKit rebuilt with Go 1.27.3; no Rust change.
# Unlike 0.7.19, field-native needs a SOURCE change: `ProxyConfig` grew a public
# field and field-native builds it literally (the three serve arms in
# mgmt/mesh.rs, and two probe rows). Each names `accept_app_capabilities:
# vec![]` rather than reaching for `..Default::default()`, for announce's
# reason: a serve forwards no tailnet grants until a contract field asks, and
# the next field truffle adds fails this build loudly instead of defaulting in
