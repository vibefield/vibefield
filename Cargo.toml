[workspace]
resolver = "2"
members = ["packages/field-native"]
# SNAP-D7 (2026-09-09): the Windows screenshot helper is its OWN workspace root
# (its manifest carries `[workspace]`), excluded here so `cargo test/clippy
# --workspace` — the mac gate — never tries to build Win32-only code. Its gates
# are the box and, from any host, `cargo check --target x86_64-pc-windows-msvc`
# inside that directory (`apps/desktop/native/windows/screenshot-helper/README.md`).
exclude = ["apps/desktop/native/windows/screenshot-helper"]

[workspace.dependencies]
# EL8 — version lockstep: exactly one truffle-core revision across every crate in
# this workspace (a borrowed Arc<Node> is type-incompatible across revisions), and
# the pin is EXACT — upgrades are deliberate events, never `cargo update` drift.
# Registry pin advanced 2026-08-02 for Artifact Hub AH-1b. The ../p008/truffle
# sibling [patch.crates-io] returns only for an active petition window, together
# with siblings.lock.json (history).
# What that advance did and did NOT buy (GT-4, 2026-08-05, read rather than
# assumed): truffle-core 0.7.11 and 0.7.12 are source-IDENTICAL published crates
# — 55 files, 28,702 Rust LOC byte-for-byte, only `version =` and
# .cargo_vcs_info.json differ. T2's rooted static serving is real but it ships in
# truffle's GO SIDECAR (packages/sidecar-slim/main.go, +543 lines), which this
# repo consumes as @vibecook/truffle-sidecar-*@0.7.12 in apps/desktop — those
# stay at 0.7.12 and AH-1b's consumption was never in doubt. release-please bumps
# that workspace as a unit, so the CRATE rode along as a no-op. Two consequences
# worth keeping: a Rust-only reading of a truffle bump can be empty and the
# payload still real, and the crate/sidecar split costs nothing because the Go
# binary shares no Rust types — the Arc<Node> law this comment opens with binds
# the CARGO graph alone.
# GT-4 (2026-08-05) — the pin conflict, and how it resolved. Adding
# ghosttea-truffle was blocked: no published version through 0.9.1 accepted
# truffle-core newer than =0.7.11, so against our =0.7.12 the resolver refused
# outright (`cargo generate-lockfile`, exit 101) rather than half-resolving. That
# refusal is the exact-pin law working as designed — a loud error at the manifest
# instead of a silent Arc<Node> type split three slices later, which is upstream's
# own stated reason for pinning truffle exactly. It resolved UPSTREAM: ghosttea
# 0.9.2 moves its workspace to truffle-core =0.7.12, so both sides now name the
# same revision and the dep joins below at that version.
# RFC 025 PETITION WINDOW — OPENED 2026-09-16 (B0), CLOSED 2026-09-16 (UA-P-X).
# While it was open truffle-core came from a SIBLING CHECKOUT rather than the
# registry: ../truffle-rfc025 (branch integration/rfc025, crate version 0.7.13),
# reached by a [patch.crates-io] row that stood where this comment ends. The
# window existed for ONE thing the registry could not sell — RFC 025's
# login-scoped nodes, which the account foundation (UA-P) needs so a node's peers
# are gated by the tailnet login. The requirement named the SIBLING's own crate
# version, not the registry's, because a [patch.crates-io] row replaces a
# dependency only when the patched package's version satisfies it: `=0.7.12`
# against a 0.7.13 path would have left the patch silently unused and pulled the
# registry crate back in. Its revision was pinned in siblings.lock.json and
# `pnpm preflight` failed on drift — CLAUDE.md §Machine setup's law, never leave
# a path patch unpinned.
# What the window could NOT buy was the PACKAGED app: apps/desktop kept
# installing @vibecook/truffle-sidecar-*@0.7.12 from npm (protocol 4), so a
# shipped build could not run a login-gated node. That was the split the exit had
# to close, and it is closed below.
#
# THE RELEASE THAT CLOSED IT — truffle 0.7.14, published 2026-09-16 (tag
# `v0.7.14` = `truffle-v0.7.14` = 9f0d6287): RFC 025's login-scoped nodes, PR
# #188's Apple fixes, and the rustls advisory fix. It shipped on crates.io and
# npm together, which is what let one event close the cargo and npm planes:
# `truffle-core`/`truffle-sidecar` 0.7.14 and `@vibecook/truffle-sidecar-*`@0.7.14
# (protocol 5). Closed with it: this requirement is a registry pin again and the
# [patch.crates-io] section is deleted · siblings.lock.json's `truffle` entry lost
# its `patch` and `go` keys · preflight's PIN_EXPECTATIONS names 0.7.14 · the five
# npm sidecar rows read 0.7.14, which is what finally gives the packaged app a
# login-gated node · scripts/stage-package.mjs needed no edit and was VERIFIED
# rather than assumed (sidecarStagingSource reads `npm` once the `go` key goes) ·
# the CI header's RFC 025 note is retired. mesh.rs and mgmt/mesh.rs needed no edit
# either, confirmed by building rather than by reading.
#
# WHAT DID NOT CLOSE — the SwiftPM plane, and it is not this repo's to close. The
# kit is in a vice, both jaws measured:
#   · FORWARD to 0.7.14 is unsatisfiable. `ghosttea` declares
#     `.package(url: …/truffle.git, exact: "0.7.12")` of its own and every
#     published ghosttea Swift tag through v0.11.1 still does, so SwiftPM refuses:
#     "root depends on 'truffle' 0.7.14 … 'ghosttea' 0.10.1 depends on 'truffle'
#     0.7.12". Two exact requirements at different versions cannot both hold.
#   · BACK to 0.7.12 resolves and then does not COMPILE: UA-P-5a (`77a771c7`)
#     taught the kit RFC 025's login API — `MeshConfiguration.loginAllow`,
#     `MeshNode.loginName/loginAllow`, `Peer.loginName` — which exists in no
#     0.7.12. Six errors across FieldTruffleRuntime.swift and
#     FieldStoreDoors+Mesh.swift; Package.swift quotes them.
# So `apps/ios/VibeFieldKit/.window/truffle` and the path package STAY, and the
# lock keeps a truffle entry carrying the `swift` half alone. This is GT-4's
# conflict in the other direction and it resolves upstream the same way: a
# ghosttea Swift release whose truffleVersion is 0.7.14. THAT is the Apple
# plane's exit, and it is the whole remaining exit list. No version divergence
# remains, though: `../truffle-rfc025` was advanced to 9f0d6287 — the commit
# tagged `truffle-v0.7.14` — and siblings.lock.json pins it there, so every plane
# reads 0.7.14 code and the path package is a delivery mechanism, not a different
# truffle.
#
# A window's machinery therefore stays live in scripts/siblings.mjs, and the
# lesson is recorded where the next one will read it: a petition window can be
# OPENED on the Apple plane unilaterally, because a root path package overrides a
# transitive edge — and it cannot be CLOSED at a new version unilaterally,
# because closing means returning to ordinary resolution, where a dependency's
# own exact pin is an equal constraint. An exit list must name that upstream
# precondition the day the window opens, not discover it at the exit.
truffle-core = "=0.7.14"
# NF-0 (native-floor spec NF-D1): ghosttea graduated to crates.io the same way,
# 2026-07-29 — exact pin, upgrades are deliberate events. NF-7 (2026-08-01) bumped
# 0.6.0 → 0.7.0 for the G7/G8/G9 petition landings (shutdown drain, silent serve,
# persistence surface; control protocol 1.13). GT-0 (same day) bumped 0.7.0 →
# 0.8.0 — zero Rust delta upstream (the release is GhostteaWorkspace layout
# rehydration on the npm side); the bump keeps the one-version law as the shell
# planes join at 0.8.0. GT-3v (2026-08-04) bumped 0.8.0 → 0.9.0 for the shared
# terminal-appearance release. This one DOES carry a Rust delta (a sparse color
# palette reaches sessions via set_appearance; the tunnel protocol's own minor
# went 6 → 8 for tracked selection and semantic cell colors), but the CONTROL
# protocol minor is unchanged at 13, so terminal_client.rs still announces 1.9 —
# the feature floor it consumes, not the newest it has heard of. GT-3f
# (2026-08-04) bumped 0.9.0 → 0.9.1 for G11's `effects` prop, which is an
# npm-side release: the crate tree's diff across the two tags is version strings
# only — zero Rust source delta — so that pin moved solely to keep the
# one-version law true across crates, npm, and SwiftPM. GT-4 (2026-08-05) bumps
# 0.9.1 → 0.9.2, the release that moves upstream's own workspace to truffle-core
# =0.7.12 so this workspace can consume the mesh half at all. CONTROL protocol
# minor is UNCHANGED at 13, so terminal_client.rs still announces 1.9.
# G12 (2026-08-09) bumps 0.9.2 → 0.9.3, and this one is ours: upstream fixed
# `ghosttea-vt-sys`'s build script, which declared three of its own OUT_DIR
# artifacts as `rerun-if-changed` INPUTS. Cargo writes a unit's fingerprint
# reference before the script finishes populating OUT_DIR, so a declared path
# under it is unconditionally newer than the reference — the unit could never be
# fresh, and every consumer build re-fetched the Ghostty VT tarball and
# recompiled the whole ghosttea chain (38s then 53s back-to-back here). It was
# invisible upstream because a build from their own checkout resolves
# `Prefix::Repository` and never takes the download path. Zero API/protocol
# delta; CONTROL minor unchanged at 13, so terminal_client.rs still announces
# 1.9. The payoff is measured below the fold, not assumed.
# TC petitions (2026-08-18) bump 0.9.3 → 0.10.0: the terminal-custody petition
# set G15–G21 landed upstream in one release. CONTROL minor 13 → 16
# (per-session scrollback gates at 1.15, structured {stage, code, osError}
# errors at 1.16); the libghostty/shim read surface gains mode_get,
# pending-wrap, per-row wrap flags, hyperlink URI + identity, saved-cursor and
# screen-parameterized reads, and the whole-screen recovery fragment (the
# TC-S6 compiler surface — consumed later; G16/G17 are consumed at this bump
# via fieldd's npm client). terminal_client.rs still announces 1.9: it reads
# nothing new. Provenance note: npm gitHead, this crate's .cargo_vcs_info.json,
# and the v0.10.0 tag all agree at 43361e53; the later v0.10.0-retry.1 tag
# (a Windows release-validation fix + a process_tree.rs delta) is NOT in any
# published 0.10.0 artifact.
# G13 (2026-08-18) bumps 0.10.0 → 0.10.1: Windows private env keys/prefixes now
# strip ASCII-case-insensitively (unix stays case-sensitive — a case variant is
# a genuinely different var there), closing the EL7 defense-in-depth leak the
# box CONFIRMED live (a `Field_Native_*` variant reached a cmd.exe PTY). Also
# carries the retry-tag's process_tree.rs hardening that 0.10.0 left behind.
# Upstream validated on real Windows (118 tests + clippy + smoke). CONTROL
# minor unchanged at 16. Consumption on our side is ONE line: kill-matrix row
# 6b drops `.fails` — the witness the G13 filing pre-registered — and only the
# BOX gate can see it pass (mac skips the row). Provenance: npm gitHead =
# crate vcs-info = peeled v0.10.1 = ad97fdb.
# G22/G23 (2026-08-23) bumps 0.10.1 → 0.11.0 — the TPv3 cell/renderer bundle:
# G22 adds the in-process `ServiceSessions` accessor (session-by-id / frame hubs /
# spawn-through-the-service / lifecycle bus), which lets `field-terminal-host`
# share the running service's session set with the T1 doors. Additive library
# surface, no wire change; field-native's existing `Session` API usage is
# unchanged. The npm rows (ghosttea-react/-protocol/-client/-electron) move to
# 0.11.0 in the SAME event to keep the one-version law. Cross-repo interop
# re-verified before the bump: ghosttea's routed codec round-trips all 42 of our
# `@vibefield/contracts` golden vectors (30 wire + 12 structural).
# G24 (2026-08-23) bumps 0.11.0 → 0.11.1 — routed session events. The delta is
# npm-side (`ghosttea-react`: host `getSession` + `applySessionEvent` + the
# inbound extension mirror); the cargo rows move in the SAME event to keep the
# one-version law, as GT-4 did in the other direction.
# GT-8b (2026-09-25) bumps 0.11.1 → 0.12.0 — terminal links: frames carry link
# targets (TRF1 section 12, additive), the loader APPLIES `link-url` and the
# snapshot carries `renderer.linkUrl`, and a local session reports its launch
# cwd from creation. A 0.x minor because `TextSnapshot.links` and
# `RendererConfig.link_url` are new public fields; field-native builds neither
# struct literally. The npm rows move in the SAME event (one-version law).
ghosttea = "=0.12.0"
# RETIRED 2026-09-14 (TM-1): `ghosttea-truffle = "=0.11.1"`, GT-4's mesh half of
# the terminal floor. It served TSP1 against an IN-PROCESS session registry
# (`TruffleTerminalMesh::serve` takes ghosttea's `Registry` by value), which is
# why the flag that enabled it had to keep the pre-cell floor alive — and why
# cell isolation and the phone were mutually exclusive. The terminal-mesh design
# (`thinking-terminal-mesh-cells.md`, T, ruled 2026-09-14) cut the seam at the
# transport instead: the phone becomes a routed T1 client of a CELL's own door,
# reached through the truffle sidecar's reverse proxy, and no adapter is needed
# on this side at all. `ghosttea-truffle` is imported from no source file now,
# so the dependency goes rather than sitting linked-but-unbuilt.
#
# The truffle-core agreement the retired comment enforced still binds in
# principle — one `Arc<Node>` type per graph — but its stated mechanism does not.
#
# **ERRATUM (2026-09-16, the RFC 025 window).** The sentence that stood here,
# "`ghosttea` brings truffle-core =0.7.12 of its own, and the exact pin above is
# what keeps one `Arc<Node>` type in the graph", is FALSE and has been since TM-1
# dropped `ghosttea-truffle`: the locked `ghosttea` 0.11.1 package lists no
# truffle-core among its dependencies at all (Cargo.lock), and `field-native` is
# the graph's ONLY consumer of the crate. The exact pin is still the law, but
# nothing else in this tree is asking for a second version — which is also why
# the RFC 025 window above could move the requirement to 0.7.13, and its exit
# move it again to 0.7.14, with no resolver conflict either time, where GT-4a's
# attempt to add a crate pinned at =0.7.11 was refused outright.
