#   · 0.7.16 — RFC 026 egress at protocol 7 (Node::loopback / egress_* /
#     egress_http_proxy; NetworkError::EgressError), the API field-native's
#     `truffle-egress` arm was compiled against on the branch (92ab2b7) and which
