<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU pane fixture</title>
<style>
  body { margin: 0; min-height: 300vh; background: #152536; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  nav { position: relative; padding: 1rem; }
  a { color: white; }
</style>
<canvas aria-label="Animated GPU workload"></canvas>
<nav><a href="#marker">Scroll to marker</a></nav><div id="marker" style="position:absolute;top:200vh"></div>
<script>
  const canvas = document.querySelector("canvas");
  const gl = canvas.getContext("webgl", { alpha: false, antialias: false });
  if (!gl) throw new Error("WebGL is unavailable");
  function shader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    return shader;
  }
  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER,
    "attribute vec2 pos; void main() { gl_Position = vec4(pos, 0.0, 1.0); }"));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    uniform vec2 size;
    uniform float phase;
    void main() {
      vec2 p = (gl_FragCoord.xy * 2.0 - size) / size.y;
      float value = 0.0;
      for (int i = 0; i < 12; i++) {
        p = mat2(0.86, -0.5, 0.5, 0.86) * p + 0.08 * sin(p.yx * 3.0 + phase);
        value += sin(p.x * 8.0 + phase) * cos(p.y * 6.0 - phase) / 12.0;
      }
      gl_FragColor = vec4(0.38 + 0.3 * value, 0.5 + 0.4 * value, 0.68 - 0.3 * value, 1.0);
    }`));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const pos = gl.getAttribLocation(program, "pos");
  const size = gl.getUniformLocation(program, "size");
  const phase = gl.getUniformLocation(program, "phase");
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  function draw(time) {
    const width = Math.max(1, Math.round(canvas.clientWidth * devicePixelRatio));
    const height = Math.max(1, Math.round(canvas.clientHeight * devicePixelRatio));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    gl.viewport(0, 0, width, height);
    gl.uniform2f(size, width, height);
    gl.uniform1f(phase, time / 1000 + scrollY / height);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    document.documentElement.dataset.gpu = "ready";
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</html>
